  async function prepare(opts) {

  function mulberry(seed) {

    const isHost = () => sess.role === 'host', log = [], ahead = new Map(), pending = new Map(), offs = [];

    const send = m => sess.send(m);

      let r;

      if (r === false) return {ok: false, reason: 'rejected'};

      const m = {t: 'sync', seq, seed, rng: rng.getState()};

    }
    function begin(reason, st) {
      if (!started) { started = true; clearTimeout(helloTimer); }
      if (o.onState) o.onState(st, {reason, seq, seed, rng: rng.getState()});
    }
    function applyRemote(m) {                                  // oaspete: o mutare numerotată de la gazdă
      if (m.seq <= seq) { stats.dupes++; return; }
      if (m.seq > seq + 1) { ahead.set(m.seq, m); send({t: 'need', from: seq}); return; }
      const mine = m.from === 'guest' && pending.has(m.cid);
      const r = tryApply(m.move, {seq: m.seq, from: m.from, mine, rng});
      if (!r.ok) { fail('diverged', {detail: r.reason}); stats.resyncs++; send({t: 'need', from: seq, force: true}); return; }
      seq = m.seq; stats.applied++;
      if (mine) { const p = pending.get(m.cid); pending.delete(m.cid); clearTimeout(p.timer); p.resolve({seq, ok: true}); }
      if (o.hash && m.h != null && String(o.hash()) !== String(m.h)) { stats.resyncs++; send({t: 'need', from: seq, force: true}); return; }
      const nx = ahead.get(seq + 1); if (nx) { ahead.delete(seq + 1); applyRemote(nx); }
    }
    function hostApply(move, from, cidv) {                     // gazdă: validează, aplică, numerotează, difuzează
      if (move == null || typeof move !== 'object') return {ok: false, reason: 'bad-move'};
      if (o.validate) { const v = o.validate(move, {from, seq: seq + 1}); if (v !== true && v !== undefined) return {ok: false, reason: typeof v === 'string' ? v : 'invalid'}; }
      const r = tryApply(move, {seq: seq + 1, from, mine: from === 'host', rng});

          const r = hostApply(m.move, 'guest', m.cid);

    }

    function hello() {

      rng: () => rng(), get rngState() { return rng.getState(); },
      /** Trimite o mutare. Gazdă: aplică imediat; oaspete: așteaptă ecoul numerotat al gazdei. Returnează Promise<{seq}>. */
      move(move) {

      /** Cere resincronizarea completă (oaspete) sau retrimite starea (gazdă). */

<style>
:root{--bg:#0d0a08;--bg2:#1a140d;--bg3:#2a2010;--ink:#f0e6d0;--muted:#c2b497;--gold:#c8832a;--gold2:#e8c87a;--line:#c8832a40;--felt:#123524;--felt2:#0b2418;--red:#ff9c8c;--ok:#9be39b;--focus:#7cc4ff;
--fd:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;--fb:'Iowan Old Style',Georgia,'Times New Roman',serif;--fm:'SF Mono','Cascadia Code',ui-monospace,Menlo,Consolas,monospace;--fu:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--cw:clamp(54px,min(8vw,10vh),104px);--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:17px;line-height:1.55;min-height:100vh;background-image:radial-gradient(1000px 600px at 85% -10%,#3a2a1055,transparent 60%),radial-gradient(900px 500px at 5% 0,#2a201055,transparent 55%);padding-bottom:84px}
a{color:var(--gold2)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--fd);font-size:1.15rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold2);margin:0;font-weight:600}
.brand small{display:block;letter-spacing:.12em;font-size:.72rem;color:var(--muted);text-transform:none;font-style:italic;margin-top:2px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--fu);font-size:.9rem}
.ctrls label{color:var(--muted)}
select,.btn,input[type=text],input[type=number]{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:44px;color:var(--ink)}
select{padding-right:8px}
.btn{cursor:pointer;font-family:var(--fu);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;background:linear-gradient(#2a2010,#1a140d)}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:linear-gradient(#c8832a,#9a6218);color:#140c02;border-color:#e8c87a}
.btn[disabled]{opacity:.45;cursor:not-allowed}
nav.tabs{padding:12px 0;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs .tablist{display:flex;gap:6px}
nav.tabs .btn[aria-selected=true]{background:linear-gradient(#c8832a,#9a6218);color:#140c02;border-color:#e8c87a}
h1,h2,h3{font-family:var(--fd);font-weight:600;line-height:1.15}
.panel > div > h2,.panel.stats > h2{font-size:1.17em}
.hero{text-align:center;padding:26px 0 8px}
.hero h1{font-size:clamp(2rem,7vw,3.6rem);margin:.1em 0;letter-spacing:.02em;background:linear-gradient(180deg,#fbf0d0,#e8c87a 55%,#c8832a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);max-width:720px;margin:6px auto;font-family:var(--fu);font-size:.98rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{font-family:var(--fu);font-size:.74rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted);background:#00000030}
.chip.ok{color:var(--ok);border-color:#9be39b55}.chip.warn{color:#ffd27a;border-color:#ffd27a66}.chip.at{color:#b9c9ff;border-color:#b9c9ff55}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px;margin:10px 0 30px}
.fiche{background:linear-gradient(#1f180e,#151008);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.fiche h2{margin:.1em 0 .2em;font-size:1.3rem;color:var(--gold2)}
.fiche p,.fiche li{font-size:.97rem}
.fiche .meta{font-family:var(--fu);font-size:.85rem;color:var(--muted)}
.fiche ul{padding-left:1.1em;margin:.3em 0}
.fiche .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fiche details{margin-top:8px}
.fiche summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-family:var(--fu);font-weight:600;color:var(--gold2)}
.warnbox{border-left:3px solid #ffd27a;background:#ffd27a14;padding:6px 10px;margin:8px 0;font-size:.92rem}
.enote{font-family:var(--fu);font-size:.75rem;color:var(--muted);font-style:italic}
.panel{background:linear-gradient(#1f180e,#151008);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;font-family:var(--fu)}
.form .f{display:flex;flex-direction:column;gap:4px}
.form .f.chk{flex-direction:row;align-items:center;gap:10px;min-height:44px}
.form .f.chk input{width:22px;height:22px}
.form small{color:var(--muted)}
/* tabla */
.board{background:radial-gradient(900px 500px at 50% 40%,var(--felt),var(--felt2));border:1px solid var(--line);border-radius:18px;padding:12px;margin:12px 0}
.scorebar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;font-family:var(--fu);font-size:.9rem;background:#0008;border-radius:12px;padding:8px 12px}
.scorebar b{font-family:var(--fm);color:var(--gold2)}
.scorebar .sc{display:flex;gap:14px;flex-wrap:wrap}
.seats{display:grid;gap:10px;grid-template-columns:minmax(64px,1fr) minmax(0,4fr) minmax(64px,1fr);grid-template-areas:". top ." "left tbl right";margin-top:10px;align-items:center}
.seats.two{grid-template-columns:1fr;grid-template-areas:"top" "tbl"}
.seat{text-align:center;font-family:var(--fu);font-size:.82rem;color:var(--muted)}
.seat.top{grid-area:top}.seat.left{grid-area:left}.seat.right{grid-area:right}
.seat.turn .nm{color:var(--gold2);text-shadow:0 0 8px #e8c87a88}
.seat .nm{font-weight:700}
.fan{display:flex;justify-content:center;margin:6px 0;min-height:30px;flex-wrap:nowrap}

/* ===== JOC ÎN DOI PE REȚEA (FFF.p2p, fără server): doar variantele în doi jucători (motorul rămâne neschimbat) ===== */
const NET_VARIANTS = ['scopa', 'scopa15', 'apt', 'cirulla'];
const hasNet = () => !!(window.FFF && FFF.p2p && typeof FFF.p2p.dialog === 'function' && typeof FFF.p2p.lockstep === 'function');
function netStart() {
  const v = $('#sv-variant'); if (!v || !NET_VARIANTS.includes(v.value)) { const m = $('#sv-netmsg'); if (m) m.textContent = T('net.pick2'); return; }
  const setup = readSetup();
  FFF.p2p.dialog({ title: T('net.title'), onOpen: sess => netOpen(sess, setup) });
}
function netHash() {
  if (!G || !G.net || !G.st) return '';

}
function netOpen(sess, setup) {
  if (G && G.net && G.net.sess === sess) return; /* 'open' poate fi emis de două ori de același canal */
  const host = sess.role === 'host';
  const net = { sess, me: host ? 0 : 1, host, up: true, log: [], ls: null, setupPub: null };
  net.ls = FFF.p2p.lockstep(sess, {
    snapshot: () => ({ setup: net.setupPub, moves: net.log.slice() }),
    onState: (state, info) => {

      netBegin(net, st.setup, Array.isArray(st.moves) ? st.moves : []);
    },
    onMove: (mv, info) => netMove(net, mv, info),
    hash: netHash,
    onError: () => { if (G && G.net === net) { G.busy = false; setStatus(T('net.rej')); renderPlay(); } }
  });
  sess.on('lost', () => { if (G && G.net === net && net.up) { setStatus(T('net.weak')); renderPlay(); } });
  sess.on('recovered', () => { if (G && G.net === net && net.up) { setStatus(G.st.turn === net.me ? T('play.yourTurn') : T('net.wait')); renderPlay(); } });

}

/* aplică (identic la ambii jucători) o mutare confirmată de gazdă; întoarce un șir dacă e ilegală */
function netMove(net, mv, info) {
