istintos — solo se mencionan.","Falta la variante de torneo (cappotto también con cuatro cartas del mismo valor en la mesa)."],"approx":["⚠ Las bonificaciones de mano se declaran automáticamente al inicio de cada reparto de 3 cartas (sin golpear, farol ni retractación), para ambos jugadores; la matta se elige automáticamente para el mejor resultado.","⚠ «La piccola» limitada a 6 y «La grande» = 5 según el resumen de Pagat; los valores exactos no se confirmaron con una segunda fuente.","⚠ La captura es obligatoria para la carta jugada si puede capturar (Pagat es menos explícito)."]},"rubamazzo":{"name":"Rubamazzo (Rubamazzetto)","origin":"Italia. Un juego simplificado parecido a la Scopa en el que se puede robar el montón del rival.","deal":"3 cartas cada uno, 4 en la mesa, repartos de 3 hasta agotar el mazo. Empieza el rival del repartidor.","rules":["Juega una carta. Si tiene el mismo valor que una carta de la mesa, te la llevas (colocando tu carta encima de tu montón). Si tiene el mismo valor que la carta de arriba del montón del rival (la última capturada, siempre visible), puedes robar todo el montón. Si ambas cosas son posibles, eliges.","Capturar o robar es obligatorio cuando es posible; si no, la carta se queda en la mesa.","Al final el resto de la mesa va al último que capturó; gana quien tenga más cartas (20–20 = empate)."],"regional":["Las reglas locales varían mucho (el As ladrón; quién puede robar de su propio montón; reglas de la última mano).","Las fuentes consultadas (Wikipedia italiana, una guía italiana) no describen ninguna protección adicional del montón ni puntos especiales."],"approx":["⚠ Las reglas regionales varían; se implementa el núcleo común de dos fuentes. Sin variante del As, sin puntos extra. IA sencilla (heurística, no Monte-Carlo)."]},"bazzica":{"name":"Scopa Bazzica","origin":"Italia (dos jugadores).","deal":"","rules":["Justo después del reparto de 3 cartas se pueden declarar combinaciones: Bazzica (tres cartas que sumen ≤ 9, figuras 10) = 3 puntos; Bazzicotto (tres cartas del mismo valor) = 10 puntos. Solo puntúa la mejor; en la bazzica gana el total más bajo, en el bazzicotto el valor más bajo. Partidas a 21 o 31."],"regional":[],"approx":[]},"scalette":{"name":"Scopa con scalette / Napola","origin":"Italia.","deal":"","rules":["Escaleras de oros: escalera baja (A-2-3, 3 puntos, ampliada hasta el Caballo = 9) y escalera alta (Rey-Caballo-Sota, 5 puntos, ampliada hacia abajo hasta el 2 = 11). Todos los oros = «Scala»: victoria. Napola: A-2-3… de oros, un punto por carta."],"regional":["Napola y Re bello son opciones en la Scopa/Scopone; las scalette solo existen en el atlas."],"approx":[]},"sbarazzina":{"name":"Sbarazzina y Piva","origin":"Emilia (Italia).","deal":"","rules":["Sbarazzina: el As se lo lleva todo sin escoba; el Re bello es un punto; bazzica 2 puntos (todos los valores distintos) o 3 (con una pareja); trío = 7; partida a 41. Piva: variante de dos jugadores con cartas piacentinas en la que llevarse el 2 de bastos vale −5 puntos; partidas a 21 o 31, las puntuaciones pueden ser negativas."],"regional":[],"approx":[]},"corsa":{"name":"Scopa corsa","origin":"Córcega.","deal":"","rules":["Baraja de 36 cartas (sin los 2). Dos jugadores: repartos de 3,3,3,3,4,4; cuatro jugadores en parejas fijas. La captura no es obligatoria. Partidas a 21 (o 16/11)."],"regional":[],"approx":[]},"chkobba":{"name":"Chkobba","origin":"Túnez; popular también en Francia.","deal":"","rules":["Baraja francesa de 40 cartas (sin 8, 9, 10; Jota 9, Reina 8). La carta del corte puede conservarse o ponerse en la mesa. Captura obligatoria; chkobba = mesa limpia, no en la última carta del repartidor. Puntuación: kārṭa (más cartas), dīnārī (diamantes), barmīla (más sietes, luego seises), sabʿa l-ḥayya (7 de diamantes), más la chkobba. Objetivo 21 (o 11/31)."],"regional":[],"approx":[]},"hurrikan":{"name":"Hurrikan","origin":"Alemania, años 30.","deal":"","rules":["Tres subrepartos de seis cartas; los corazones son el palo de bonificación (7 de corazones = 1 punto, seis o más corazones = 1 punto). Objetivo 16; partida doble si el perdedor tiene menos de 8."],"regional":[],"approx":[]},"cicera":{"name":"Cicera, Cirullone","origin":"Brescia (Cicera), Liguria (Cirullone).","deal":"","rules":["Juegos cercanos a la Cirulla/Scopone, con páginas propias en Pagat; no se pudieron leer aquí sus reglas completas, así que no se describen ni se implementan."],"regional":[],"approx":[]}},"pt":{"scopa":{"name":"Scopa","origin":"Itália (em todo o país; o jogo de cartas italiano mais difundido). Joga-se com o baralho italiano de 40 cartas (ouros, copas, espadas, paus).","deal":"O dador dá 3 cartas a cada jogador e coloca 4 cartas voltadas para cima na mesa; o resto é o baralho. Depois de jogadas as 3 cartas, dão-se mais 3 a cada um, sem pôr mais nada na mesa, até acabar o baralho (a dois jogadores: 6 rondas). Se estiverem 3 ou 4 reis na mesa, baralha-se e dá-se de novo.","rules":["Valores de captura: Ás 1, 2–7 o seu valor, Fante (valete) 8, Cavallo (cavalo/dama) 9, Re (rei) 10.","Uma jogada consiste em jogar uma carta. Uma carta igual a uma da mesa captura-a (se houver várias, escolhe). Só se não existir nenhuma carta igual é que pode levar um conjunto de cartas da mesa cuja soma seja igual à sua carta (prioridade da carta igual). Caso contrário, a carta fica na mesa.","A captura é obrigatória quando é possível; a escolha da carta a jogar é livre.","Capturar todas as cartas da mesa é uma vassoura (scopa, 1 ponto). Uma captura feita com a última carta da mão nunca é vassoura. No fim, as cartas que restam na mesa vão para o último jogador que capturou.","Pontuação da mão: vassouras; Carte (mais cartas); Denari (mais ouros); Settebello (7 de ouros); Primiera (a melhor primiera: uma carta por naipe, valores 7=21, 6=18, Ás=16, 5=15, 4=14, 3=13, 2=12, figuras=10; um lado a que falte um naipe não a pode pontuar). Um empate não dá ponto.","Joga-se até 11 pontos (21 ou 31 por acordo); se ambos ultrapassarem o objetivo na mesma mão, ganha a pontuação mais alta; em caso de empate, joga-se outra mão.","A dois jogadores, começa o adversário do dador e a distribuição alterna a cada mão."],"regional":["O nordeste usa cartas com naipes franceses com Rei, Dama, Valete.","Escalas regionais da primiera: algumas zonas contam 2–7 pelo valor facial, o Ás 5½ e as figuras ½.","Opcionais: Re bello (rei de ouros +1) e Napola (A-2-3… de ouros) — disponíveis como opções.","«Chiamarsi fuori» (declarar o objetivo antes do fim da mão) não está implementado."],"approx":[]},"scopone":{"name":"Scopone 9+4 (Wikipédia: «scientifico»)","origin":"Itália. A versão de quatro jogadores em pares (os parceiros sentam-se em frente), com 4 cartas na mesa no início.","deal":"Cada jogador recebe 9 cartas e 4 cartas vão para a mesa voltadas para cima (36 + 4 = 40). Com 3 ou 4 reis na mesa, baralha-se e dá-se de novo. Começa o jogador à direita do dador; joga-se no sentido contrário ao dos ponteiros do relógio.","rules":["As capturas, as vassouras, a regra da última mão e a pontuação são como na Scopa; as cartas ganhas vão para o monte comum da parceria.","Uma vassoura feita com a última carta da mão não conta (uma opção pode ativá-la).","Objetivo: 11 pontos (opcionalmente 21); se ambos os lados o ultrapassarem na mesma mão, ganha a pontuação mais alta; em caso de empate, jogam-se mais mãos."],"regional":["⚠ NOME DISPUTADO: o Pagat e um guia italiano (Aranzulla) chamam «Scopone» ao 9+4 e «Scopone scientifico» ao jogo de 10 cartas com mesa vazia; as Wikipédias italiana e inglesa atribuem-no ao contrário (scientifico = 9 cartas + 4 na mesa; o jogo de 10 cartas é «Scopone a 10 carte»). As regras jogadas são as mesmas seja qual for o nome; não foi possível consultar o regulamento da federação. A variante está por isso identificada aqui pelo número de cartas.","Objetivo 21 em algumas fontes (Wikipédia italiana); 11 no Pagat (predefinição aqui, 21 como opção)."],"approx":["⚠ As regras seguem as fontes; só o NOME (Scopone / Scopone scientifico) difere entre fontes — ver «Diferenças regionais»."]},"scopone_s":{"name":"Scopone de 10 cartas, mesa vazia (Pagat: «scientifico»)","origin":"Itália. O membro «intelectual» da família: distribuem-se as 40 cartas (10 a cada um), a mesa começa vazia e um jogador atento pode contar cartas (todas as cartas jogadas estão, em princípio, visíveis na memória).","deal":"Cada jogador recebe 10 cartas; a mesa começa vazia. Começa o jogador à direita do dador; sentido contrário ao dos ponteiros do relógio. Os parceiros sentam-se em frente (lugares 0–2 contra 1–3).","rules":["Capturas como na Scopa (a carta igual tem prioridade, senão uma soma); a captura é obrigatória quando é possível.","Uma vassoura (mesa limpa) vale 1 ponto, mas NÃO com a última carta da mão. Alguns jogadores atribuem mesmo assim uma vassoura ao lado do dador na última carta (opção: «A vassoura conta também na última carta»).","Pontuação da mão: vassouras mais até 4 pontos (Carte, Denari, Settebello, Primiera). Não há um total constante por mão: a pontuação de uma mão depende das vassouras. O objetivo do jogo (11 ou 21) é o que por vezes se chama «11 pontos».","Opções: Re bello (+1), Napola (A-2-3… de ouros, valor = comprimento da sequência), Napoleone (os 10 ouros ganham).","Durante o jogo as 40 cartas acabam nos montes das parcerias; no fim as 40 estão nos montes."],"regional":["⚠ NOME DISPUTADO: o Pagat e Aranzulla chamam a esta variante (10 cartas, mesa vazia) «Scopone scientifico»; as Wikipédias italiana/inglesa chamam-lhe «Scopone a 10 carte» e reservam «scientifico» para o 9+4. As regras são as mesmas. «9 cartas e mesa vazia» é impossível (4×9=36).","Uma vassoura na última carta do dador é discutida (Pagat: «alguns defendem que pontua a equipa do dador»); por predefinição não conta.","Existe uma Federazione Italiana Scopone (federazionescopone.it); não foi possível consultar o seu regulamento para este projeto — usa-se o Pagat. O objetivo oficial (11 ou 21) varia consoante a fonte."],"approx":["⚠ As regras seguem as fontes; só o NOME difere entre fontes — ver «Diferenças regionais»."]},"scopa15":{"name":"Scopa a 15 (Scopa di quindici)","origin":"Itália. Uma Scopa em que a soma pretendida é 15 em vez do valor da carta jogada. O Pagat descreve três versões; as duas primeiras estão implementadas.","deal":"Como na Scopa: 3 cartas a cada um, 4 na mesa, distribuições de 3, nova distribuição com 3–4 reis.","rules":["Versão a (predefinição): só pode levar cartas da mesa que, juntamente com a carta jogada, somem exatamente 15. Uma carta não pode capturar sozinha uma carta igual (p. ex., um 5 pode levar um 10).","Versão b: a carta jogada pode capturar uma carta igual, um conjunto de igual valor total ou um conjunto que com ela faça 15 (sem prioridade fixa: escolhe).","A captura é obrigatória quando é possível; vassoura, última carta, pontuação e objetivo como na Scopa (11/21/31)."],"regional":["A versão 3 do Pagat (a segunda mais o Ás que leva tudo como vassoura, normalmente até 31) só existe no atlas.","Alguns jogam uma regra de «menos cartas» (na versão 2) — não implementada.","Aparentada com a escoba espanhola e jogos semelhantes; não verificado aqui."],"approx":["Faltam a versão 3 e a regra de «menos cartas» (só no atlas)."]},"apt":{"name":"Asso piglia tutto (o Ás leva tudo)","origin":"Itália. Uma Scopa em que o Ás tem poderes especiais.","deal":"Como na Scopa (3+4, distribuições de 3, nova distribuição com 3–4 reis).","rules":["Um Ás jogado numa mesa sem outro Ás leva todas as cartas da mesa e pontua vassoura. Se já houver um Ás na mesa, o Ás jogado leva apenas esse Ás (com vários Ases, escolhe um). Numa mesa vazia o Ás fica lá.","As outras cartas jogam-se como na Scopa. Pontuação como na Scopa."],"regional":["O Pagat descreve a regra de forma breve; o caso de vários Ases na mesa não é indicado; aqui aplica-se a regra normal da Scopa (escolhe um Ás igual).","A Wikipédia italiana acrescenta uma regra opcional «del vile» (o primeiro jogador não pode jogar um Ás numa mesa vazia) — não implementada."],"approx":["⚠ A descrição do Pagat é curta; quando há vários Ases na mesa o Ás jogado leva só um, à sua escolha (interpretação; o Pagat nada diz)."]},"dassi":{"name":"Scopa d’assi","origin":"Itália. Como Asso piglia tutto, mas o Ás que leva tudo não pontua vassoura; costuma jogar-se a quatro em pares com 9–10 cartas.","deal":"Implementado: 4 jogadores em pares, 10 cartas cada, mesa vazia, sem condição de nova distribuição (Wikipédia italiana). Começa o jogador à direita do dador.","rules":["Um Ás jogado numa mesa sem Ás leva todas as cartas da mesa e NÃO pontua vassoura; se houver um Ás na mesa, o Ás jogado leva apenas esse Ás (como em Asso piglia tutto). Numa mesa vazia o Ás fica lá.","Outras cartas: como na Scopa (a carta igual tem prioridade, senão uma soma); uma vassoura feita com uma carta que não seja Ás conta.","Pontuação: Carte, Denari, Settebello, Primiera (+ vassouras), objetivo 11/21."],"regional":["Variantes do Pagat: um Ás jogado numa mesa vazia leva-se a si próprio; nova distribuição se aparecer um Ás na disposição inicial. Não implementadas.","O Pagat define a Scopa d’assi como Asso piglia tutto sem ponto de vassoura para o Ás que leva tudo; o mesmo tratamento do Ás aplica-se quando já há um Ás na mesa."],"approx":["⚠ As fontes diferem em pormenores (Ás em mesa vazia, vassouras feitas com cartas que não são Ases, 9 ou 10 cartas); aqui: 10 cartas, um Ás leva tudo (quando não há Ás na mesa) sem vassoura, as vassouras feitas com outras cartas contam, o Ás numa mesa vazia fica."]},"cirulla":{"name":"Cirulla","origin":"Ligúria (Génova) e Baixo Piemonte. Tradicionalmente joga-se com cartas genovesas de naipes franceses; aqui com qualquer baralho de 40 cartas.","deal":"3 cartas a cada um e 4 na mesa; nova distribuição se houver 2 ou mais Ases na mesa. Se as 4 cartas da mesa somarem exatamente 15 (1 vassoura) ou 30 (2 vassouras), o dador leva-as logo.","rules":["Capturas (à sua escolha): uma carta igual; um conjunto com a mesma soma; cartas que com a carta jogada façam 15; um Ás leva toda a mesa se não houver Ás nela. Vassoura = mesa limpa (1 ponto); no fim o resto da mesa vai para o último que capturou, sem vassoura.","Bónus de mão: três cartas que somem ≤ 9 = 3 vassouras («barsega»); três cartas iguais = 10 vassouras («barsegon»); o 7 de copas (♥) é um curinga (matta) só para o bónus.","Pontuação: vassouras, Carte, Denari, Settebello, Primiera, La piccola (A-2-3… de ouros, 1 ponto por carta, mínimo 3, no máximo 6), La grande (Rei+Cavalo+Valete de ouros = 5). Os 10 ouros = «cappotto»: vitória imediata.","Objetivo: 51 (em alternativa 31/21); a mão é de qualquer modo terminada."],"regional":["O Pagat refere vários momentos permitidos para declarar os bónus (bater: no início da vez, entre a distribuição e a primeira carta, logo após a distribuição).","Cirullone (Ligúria) e Cicera (Brescia) são jogos aparentados/distintos — apenas mencionados.","Falta a variante de torneio (cappotto também com quatro cartas do mesmo valor na mesa)."],"approx":["⚠ Os bónus de mão são declarados automaticamente no início de cada distribuição de 3 cartas (sem bater, bluff nem retratação), para ambos os jogadores; a matta é escolhida automaticamente para o melhor resultado.","⚠ «La piccola» limitada a 6 e «La grande» = 5 segundo o resumo do Pagat; os valores exatos não foram confirmados por uma segunda fonte.","⚠ A captura é obrigatória para a carta jogada se puder capturar (o Pagat é menos explícito)."]},"rubamazzo":{"name":"Rubamazzo (Rubamazzetto)","origin":"Itália. Um jogo simplificado semelhante à Scopa em que se pode roubar o monte do adversário.","deal":"3 cartas a cada um, 4 na mesa, distribuições de 3 até esgotar o baralho. Começa o adversário do dador.","rules":["Jogue uma carta. Se tiver o mesmo valor que uma carta da mesa, leva-a (pondo a sua carta em cima do seu monte). Se tiver o mesmo valor que a carta de cima do monte do adversário (a última capturada, sempre visível), pode roubar todo o monte. Se ambas as coisas forem possíveis, escolhe.","Capturar ou roubar é obrigatório quando é possível; caso contrário, a carta fica na mesa.","No fim, o resto da mesa vai para o último que capturou; ganha quem tiver mais cartas (20–20 = empate)."],"regional":["As regras locais variam muito (o Ás ladrão; quem pode roubar do próprio monte; regras da última mão).","As fontes consultadas (Wikipédia italiana, um guia italiano) não descrevem nenhuma proteção adicional do monte nem pontos especiais."],"approx":["⚠ As regras regionais variam; implementa-se o núcleo comum de duas fontes. Sem variante do Ás, sem pontos extra. IA simples (heurística, não Monte-Carlo)."]},"bazzica":{"name":"Scopa Bazzica","origin":"Itália (dois jogadores).","deal":"","rules":["Logo após a distribuição de 3 cartas podem declarar-se combinações: Bazzica (três cartas que somem ≤ 9, figuras 10) = 3 pontos; Bazzicotto (três cartas do mesmo valor) = 10 pontos. Só pontua a melhor; na bazzica ganha o total mais baixo, no bazzicotto o valor mais baixo. Jogos até 21 ou 31."],"regional":[],"approx":[]},"scalette":{"name":"Scopa com scalette / Napola","origin":"Itália.","deal":"","rules":["Sequências de ouros: escada baixa (A-2-3, 3 pontos, alargada até ao Cavalo = 9) e escada alta (Rei-Cavalo-Valete, 5 pontos, alargada para baixo até ao 2 = 11). Todos os ouros = «Scala»: vitória. Napola: A-2-3… de ouros, um ponto por carta."],"regional":["Napola e Re bello são opções na Scopa/Scopone; as scalette só existem no atlas."],"approx":[]},"sbarazzina":{"name":"Sbarazzina e Piva","origin":"Emília (Itália).","deal":"","rules":["Sbarazzina: o Ás leva tudo sem vassoura; o Re bello é um ponto; bazzica 2 pontos (todos os valores diferentes) ou 3 (com um par); trio = 7; jogo até 41. Piva: variante a dois jogadores com cartas piacentinas em que levar o 2 de paus vale −5 pontos; jogos até 21 ou 31, as pontuações podem ser negativas."],"regional":[],"approx":[]},"corsa":{"name":"Scopa corsa","origin":"Córsega.","deal":"","rules":["Baralho de 36 cartas (sem os 2). Dois jogadores: distribuições de 3,3,3,3,4,4; quatro jogadores em pares fixos. A captura não é obrigatória. Jogos até 21 (ou 16/11)."],"regional":[],"approx":[]},"chkobba":{"name":"Chkobba","origin":"Tunísia; popular também em França.","deal":"","rules":["Baralho francês de 40 cartas (sem 8, 9, 10; Valete 9, Dama 8). A carta do corte pode ser guardada ou posta na mesa. Captura obrigatória; chkobba = mesa limpa, não na última carta do dador. Pontuação: kārṭa (mais cartas), dīnārī (ouros), barmīla (mais setes, depois seis), sabʿa l-ḥayya (7 de ouros), mais a chkobba. Objetivo 21 (ou 11/31)."],"regional":[],"approx":[]},"hurrikan":{"name":"Hurrikan","origin":"Alemanha, anos 1930.","deal":"","rules":["Três sub-distribuições de seis cartas; os ♥ (copas do baralho francês) são o naipe de bónus (7 de ♥ = 1 ponto, seis ou mais ♥ = 1 ponto). Objetivo 16; jogo duplo se o perdedor tiver menos de 8."],"regional":[],"approx":[]},"cicera":{"name":"Cicera, Cirullone","origin":"Brescia (Cicera), Ligúria (Cirullone).","deal":"","rules":["Jogos próximos da Cirulla/Scopone, com páginas separadas no Pagat; as suas regras completas não puderam ser lidas aqui, por isso não são descritas nem implementadas."],"regional":[],"approx":[]}},"de":{"scopa":{"name":"Scopa","origin":"Italien (landesweit; das verbreitetste italienische Kartenspiel). Gespielt wird mit dem italienischen 40-Karten-Blatt (Münzen, Kelche, Schwerter, Stäbe).","deal":"Der Geber gibt jedem Spieler 3 Karten und legt 4 Karten offen auf den Tisch; der Rest ist der Stapel. Sind die 3 Karten gespielt, gibt man jedem weitere 3, ohne etwas auf den Tisch zu legen, bis der Stapel aufgebraucht ist (zu zweit: 6 Runden). Liegen 3 oder 4 Könige auf dem Tisch, wird neu gemischt und neu gegeben.","rules":["Nehmwerte: Ass 1, 2–7 Nennwert, Fante (Bube) 8, Cavallo (Pferd/Dame) 9, Re (König) 10.","Ein Zug besteht darin, eine Karte auszuspielen. Eine Karte, die einer Tischkarte gleicht, nimmt diese (bei mehreren wählt man). Nur wenn keine einzelne Karte passt, darf man eine Gruppe von Tischkarten nehmen, deren Summe der eigenen Karte entspricht (Vorrang der gleichen Karte). Sonst bleibt die Karte auf dem Tisch.","Nehmen ist Pflicht, wenn es möglich ist; die Wahl der auszuspielenden Karte ist frei.","Alle Tischkarten zu nehmen ist eine Scopa (Besen, 1 Punkt). Ein Stich mit der allerletzten Karte der Hand ist nie eine Scopa. Am Ende gehen die auf dem Tisch verbliebenen Karten an den Spieler, der zuletzt genommen hat.","Wertung der Runde: Besen; Carte (meiste Karten); Denari (meiste Münzen); Settebello (Münz-7); Primiera (beste Primiera: eine Karte je Farbe, Werte 7=21, 6=18, Ass=16, 5=15, 4=14, 3=13, 2=12, Bildkarten=10; wem eine Farbe fehlt, kann sie nicht werten). Gleichstand bringt keinen Punkt.","Gespielt wird bis 11 Punkte (21 oder 31 nach Absprache); überschreiten beide das Ziel in derselben Runde, gewinnt die höhere Punktzahl; bei Gleichstand wird eine weitere Runde gespielt.","Zu zweit spielt der Gegner des Gebers aus, und das Geben wechselt jede Runde."],"regional":["Im Nordosten verwendet man Karten mit französischen Farben mit König, Dame, Bube.","Regionale Primiera-Skalen: Manche Gegenden zählen 2–7 zum Nennwert, das Ass 5½ und Bildkarten ½.","Optional: Re bello (Münz-König +1) und Napola (A-2-3… in Münzen) — als Optionen verfügbar.","„Chiamarsi fuori“ (das Ziel vor Rundenende ansagen) ist nicht umgesetzt."],"approx":[]},"scopone":{"name":"Scopone 9+4 (Wikipedia: „scientifico“)","origin":"Italien. Die Variante für vier Spieler in Paaren (Partner sitzen sich gegenüber), mit 4 Karten zu Beginn auf dem Tisch.","deal":"Jeder Spieler erhält 9 Karten, und 4 Karten kommen offen auf den Tisch (36 + 4 = 40). Bei 3 oder 4 Königen auf dem Tisch wird neu gemischt und neu gegeben. Der Spieler rechts vom Geber spielt aus; gespielt wird gegen den Uhrzeigersinn.","rules":["Nehmen, Besen, Regel der letzten Runde und Wertung wie bei der Scopa; gewonnene Karten kommen auf den gemeinsamen Stapel des Paares.","Ein Besen mit der letzten Karte der Hand zählt nicht (eine Option kann ihn aktivieren).","Ziel: 11 Punkte (optional 21); überschreiten beide Seiten es in derselben Runde, gewinnt die höhere Punktzahl; bei Gleichstand werden weitere Runden gespielt."],"regional":["⚠ UMSTRITTENER NAME: Pagat und ein italienischer Ratgeber (Aranzulla) nennen das 9+4 „Scopone“ und das 10-Karten-Spiel mit leerem Tisch „Scopone scientifico“; die italienische und die englische Wikipedia ordnen es umgekehrt zu (scientifico = 9 Karten + 4 auf dem Tisch; das 10-Karten-Spiel heißt „Scopone a 10 carte“). Die gespielten Regeln sind unabhängig vom Namen dieselben; das Regelwerk des Verbands konnte nicht eingesehen werden. Die Variante wird hier deshalb nach der Kartenzahl benannt.","Ziel 21 in manchen Quellen (italienische Wikipedia); 11 bei Pagat (hier Standard, 21 als Option)."],"approx":["⚠ Die Regeln folgen den Quellen; nur der NAME (Scopone / Scopone scientifico) unterscheidet sich zwischen den Quellen — siehe „Regionale Unterschiede“."]},"scopone_s":{"name":"Scopone mit 10 Karten, leerer Tisch (Pagat: „scientifico“)","origin":"Italien. Das „intellektuelle“ Mitglied der Familie: Alle 40 Karten werden ausgeteilt (je 10), der Tisch ist zu Beginn leer, und ein aufmerksamer Spieler kann Karten zählen (alle gespielten Karten sind im Prinzip im Gedächtnis sichtbar).","deal":"Jeder Spieler erhält 10 Karten; der Tisch ist zu Beginn leer. Der Spieler rechts vom Geber spielt aus; gegen den Uhrzeigersinn. Partner sitzen sich gegenüber (Plätze 0–2 gegen 1–3).","rules":["Nehmen wie bei der Scopa (die gleiche Karte hat Vorrang, sonst eine Summe); Nehmen ist Pflicht, wenn es möglich ist.","Ein Besen (Tisch geleert) ist 1 Punkt, aber NICHT mit der letzten Karte der Hand. Manche Spieler geben der Seite des Gebers bei der letzten Karte dennoch einen Besen (Option: „Besen zählt auch bei der letzten Karte“).","Wertung der Runde: Besen plus bis zu 4 Punkte (Carte, Denari, Settebello, Primiera). Es gibt keine feste Summe pro Runde: Die Punktzahl einer Runde hängt von den Besen ab. Das Spielziel (11 oder 21) ist das, was manchmal „11 Punkte“ genannt wird.","Optionen: Re bello (+1), Napola (A-2-3… in Münzen, Wert = Länge der Folge), Napoleone (alle 10 Münzen gewinnen).","Im Spielverlauf landen die 40 Karten auf den Stapeln der Paare; am Ende liegen alle 40 auf den Stapeln."],"regional":["⚠ UMSTRITTENER NAME: Pagat und Aranzulla nennen diese Variante (10 Karten, leerer Tisch) „Scopone scientifico“; die italienische/englische Wikipedia nennt sie „Scopone a 10 carte“ und reserviert „scientifico“ für das 9+4. Die Regeln sind dieselben. „9 Karten und leerer Tisch“ ist unmöglich (4×9=36).","Ein Besen auf der letzten Karte des Gebers ist umstritten (Pagat: „manche meinen, das Team des Gebers punktet“); standardmäßig zählt er nicht.","Es gibt eine Federazione Italiana Scopone (federazionescopone.it); ihr Regelwerk konnte für dieses Projekt nicht eingesehen werden — Pagat wird verwendet. Das offizielle Ziel (11 oder 21) variiert je nach Quelle."],"approx":["⚠ Die Regeln folgen den Quellen; nur der NAME unterscheidet sich zwischen den Quellen — siehe „Regionale Unterschiede“."]},"scopa15":{"name":"Scopa a 15 (Scopa di quindici)","origin":"Italien. Eine Scopa, bei der die Zielsumme 15 ist statt des Werts der ausgespielten Karte. Pagat beschreibt drei Fassungen; die ersten beiden sind umgesetzt.","deal":"Wie bei der Scopa: je 3 Karten, 4 auf dem Tisch, Nachgeben zu je 3, neu geben bei 3–4 Königen.","rules":["Fassung a (Standard): Man darf NUR Tischkarten nehmen, die zusammen mit der ausgespielten Karte genau 15 ergeben. Eine Karte kann nicht allein eine gleiche Karte nehmen (z. B. kann eine 5 eine 10 nehmen).","Fassung b: Die ausgespielte Karte darf entweder eine gleiche Karte, eine Gruppe gleicher Gesamtsumme oder eine Gruppe nehmen, die mit ihr 15 ergibt (keine feste Rangfolge: Sie wählen).","Nehmen ist Pflicht, wenn es möglich ist; Besen, letzte Karte, Wertung und Ziel wie bei der Scopa (11/21/31)."],"regional":["Pagats Fassung 3 (die zweite plus „Ass nimmt alles“ als Besen, meist bis 31) gibt es nur im Atlas.","Manche spielen eine „wenigste Karten“-Regel (in Fassung 2) — nicht umgesetzt.","Verwandt mit dem spanischen Escoba und ähnlichen Spielen; hier nicht geprüft."],"approx":["Fassung 3 und die „wenigste Karten“-Regel fehlen (nur Atlas)."]},"apt":{"name":"Asso piglia tutto (das Ass nimmt alles)","origin":"Italien. Eine Scopa, in der das Ass besondere Kräfte hat.","deal":"Wie bei der Scopa (3+4, Nachgeben zu je 3, neu geben bei 3–4 Königen).","rules":["Ein Ass, das auf einen Tisch ohne weiteres Ass gespielt wird, nimmt alle Tischkarten und zählt als Besen. Liegt schon ein Ass auf dem Tisch, nimmt das ausgespielte Ass nur dieses Ass (bei mehreren Assen wählen Sie eines). Auf einem leeren Tisch bleibt das Ass liegen.","Die übrigen Karten werden wie bei der Scopa gespielt. Wertung wie bei der Scopa."],"regional":["Pagat beschreibt die Regel knapp; der Fall mehrerer Asse auf dem Tisch wird nicht genannt; hier gilt die gewöhnliche Scopa-Regel (Sie wählen ein gleiches Ass).","Die italienische Wikipedia nennt zusätzlich eine optionale Regel „del vile“ (der erste Spieler darf kein Ass auf einen leeren Tisch spielen) — nicht umgesetzt."],"approx":["⚠ Pagats Beschreibung ist kurz; liegen mehrere Asse auf dem Tisch, nimmt das ausgespielte Ass nur eines, nach Ihrer Wahl (Auslegung; Pagat schweigt)."]},"dassi":{"name":"Scopa d’assi","origin":"Italien. Wie Asso piglia tutto, aber das Ass, das alles nimmt, zählt keinen Besen; wird oft zu viert in Paaren mit 9–10 Karten gespielt.","deal":"Umgesetzt: 4 Spieler in Paaren, je 10 Karten, leerer Tisch, keine Bedingung zum Neugeben (italienische Wikipedia). Der Spieler rechts vom Geber spielt aus.","rules":["Ein Ass, das auf einen Tisch ohne Ass gespielt wird, nimmt alle Tischkarten und zählt KEINEN Besen; liegt ein Ass auf dem Tisch, nimmt das ausgespielte Ass nur dieses Ass (wie bei Asso piglia tutto). Auf einem leeren Tisch bleibt das Ass liegen.","Andere Karten: wie bei der Scopa (die gleiche Karte hat Vorrang, sonst eine Summe); ein Besen mit einer Nicht-Ass-Karte zählt.","Wertung: Carte, Denari, Settebello, Primiera (+ Besen), Ziel 11/21."],"regional":["Pagats Varianten: Ein auf einen leeren Tisch gespieltes Ass nimmt sich selbst; neu geben, wenn ein Ass in der Anfangsauslage erscheint. Nicht umgesetzt.","Pagat definiert die Scopa d’assi als Asso piglia tutto ohne Besenpunkt für das Ass, das alles nimmt; dieselbe Behandlung des Asses gilt, wenn schon ein Ass auf dem Tisch liegt."],"approx":["⚠ Die Quellen unterscheiden sich in Details (Ass auf leerem Tisch, Besen mit Nicht-Assen, 9 oder 10 Karten); hier: 10 Karten, ein Ass nimmt alles (wenn kein Ass auf dem Tisch liegt) ohne Besen, Besen mit anderen Karten zählen, ein Ass auf leerem Tisch bleibt liegen."]},"cirulla":{"name":"Cirulla","origin":"Ligurien (Genua) und Unterpiemont. Traditionell mit genuesischen Karten mit französischen Farben gespielt; hier mit jedem 40-Karten-Blatt.","deal":"Je 3 Karten und 4 auf dem Tisch; neu geben, wenn 2 oder mehr Asse auf dem Tisch liegen. Ergeben die 4 Tischkarten genau 15 (1 Besen) oder 30 (2 Besen), nimmt der Geber sie sofort.","rules":["Nehmen (nach Wahl): eine gleiche Karte; eine Gruppe mit gleicher Summe; Karten, die mit der ausgespielten Karte 15 ergeben; ein Ass nimmt den ganzen Tisch, wenn kein Ass darauf liegt. Besen = Tisch geleert (1 Punkt); am Ende geht der Tischrest ohne Besen an den letzten Nehmenden.","Rundenboni: drei Karten mit Summe ≤ 9 = 3 Besen („barsega“); drei gleiche Karten = 10 Besen („barsegon“); die 7 der Kelche (Herz) ist ein Joker (matta), nur für den Bonus.","Wertung: Besen, Carte, Denari, Settebello, Primiera, La piccola (A-2-3… in Münzen, 1 Punkt pro Karte, mindestens 3, höchstens 6), La grande (König+Pferd+Bube in Münzen = 5). Alle 10 Münzen = „cappotto“: sofortiger Sieg.","Ziel: 51 (alternativ 31/21); die Runde wird trotzdem zu Ende gespielt."],"regional":["Pagat nennt mehrere erlaubte Zeitpunkte, um Boni anzusagen (Klopfen: zu Beginn des Zugs, zwischen Geben und erster Karte, unmittelbar nach dem Geben).","Cirullone (Ligurien) und Cicera (Brescia) sind verwandte/eigene Spiele — nur erwähnt.","Die Turniervariante (cappotto auch bei vier gleichen Werten auf dem Tisch) fehlt."],"approx":["⚠ Rundenboni werden zu Beginn jedes 3-Karten-Gebens automatisch angesagt (kein Klopfen, Bluffen oder Zurücknehmen), für beide Spieler; die Matta wird automatisch für das beste Ergebnis gewählt.","⚠ „La piccola“ auf 6 begrenzt und „La grande“ = 5 nach Pagats Zusammenfassung; die genauen Werte wurden nicht durch eine zweite Quelle bestätigt.","⚠ Nehmen ist für die ausgespielte Karte Pflicht, wenn sie nehmen kann (Pagat ist weniger eindeutig)."]},"rubamazzo":{"name":"Rubamazzo (Rubamazzetto)","origin":"Italien. Ein vereinfachtes Scopa-ähnliches Spiel, bei dem man den Stapel des Gegners stehlen kann.","deal":"Je 3 Karten, 4 auf dem Tisch, Nachgeben zu je 3, bis der Stapel erschöpft ist. Der Gegner des Gebers spielt aus.","rules":["Spiele eine Karte. Hat sie denselben Wert wie eine Tischkarte, nimmst du sie (deine Karte legst du oben auf deinen Stapel). Hat sie denselben Wert wie die oberste Karte des gegnerischen Stapels (die zuletzt genommene, stets sichtbar), darfst du den ganzen Stapel stehlen. Sind beide Züge möglich, wählst du.","Nehmen oder Stehlen ist Pflicht, wenn es möglich ist; sonst bleibt die Karte auf dem Tisch.","Am Ende geht der Tischrest an den letzten Nehmenden; wer die meisten Karten hat, gewinnt (20–20 = Unentschieden)."],"regional":["Lokale Regeln unterscheiden sich stark (das stehlende Ass; wer vom eigenen Stapel stehlen darf; Regeln zur letzten Runde).","Die gelesenen Quellen (italienische Wikipedia, ein italienischer Ratgeber) beschreiben keinen zusätzlichen Stapelschutz und keine Sonderpunkte."],"approx":["⚠ Regionale Regeln unterscheiden sich; umgesetzt ist der gemeinsame Kern zweier Quellen. Keine Ass-Variante, keine Zusatzpunkte. Einfache KI (heuristisch, nicht Monte-Carlo)."]},"bazzica":{"name":"Scopa Bazzica","origin":"Italien (zwei Spieler).","deal":"","rules":["Gleich nach dem Geben von 3 Karten dürfen Kombinationen angesagt werden: Bazzica (drei Karten mit Summe ≤ 9, Bildkarten 10) = 3 Punkte; Bazzicotto (drei Karten gleichen Werts) = 10 Punkte. Es zählt nur die bessere; bei der Bazzica gewinnt die niedrigere Summe, beim Bazzicotto der niedrigere Wert. Spiele bis 21 oder 31."],"regional":[],"approx":[]},"scalette":{"name":"Scopa mit Scalette / Napola","origin":"Italien.","deal":"","rules":["Folgen in Münzen: kleine Leiter (A-2-3, 3 Punkte, verlängert bis zum Pferd = 9) und große Leiter (König-Pferd-Bube, 5 Punkte, nach unten verlängert bis zur 2 = 11). Alle Münzen = „Scala“: Sieg. Napola: A-2-3… in Münzen, ein Punkt pro Karte."],"regional":["Napola und Re bello sind Optionen in Scopa/Scopone; Scalette gibt es nur im Atlas."],"approx":[]},"sbarazzina":{"name":"Sbarazzina und Piva","origin":"Emilia (Italien).","deal":"","rules":["Sbarazzina: Das Ass nimmt alles ohne Besen; der Re bello ist ein Punkt; Bazzica 2 Punkte (alle Werte verschieden) oder 3 (mit einem Paar); Drilling = 7; Spiel bis 41. Piva: Zwei-Personen-Variante mit piacentinischen Karten, bei der das Nehmen der Stäbe-2 −5 Punkte bedeutet; Spiele bis 21 oder 31, Punktestände können negativ werden."],"regional":[],"approx":[]},"corsa":{"name":"Korsische Scopa","origin":"Korsika.","deal":"","rules":["36-Karten-Blatt (ohne die 2er). Zu zweit: Geben zu 3,3,3,3,4,4; zu viert in festen Paaren. Nehmen ist nicht Pflicht. Spiele bis 21 (oder 16/11)."],"regional":[],"approx":[]},"chkobba":{"name":"Chkobba","origin":"Tunesien; auch in Frankreich beliebt.","deal":"","rules":["Französisches 40-Karten-Blatt (ohne 8, 9, 10; Bube 9, Dame 8). Die Abhebekarte darf behalten oder auf den Tisch gelegt werden. Nehmen ist Pflicht; Chkobba = Tisch geleert, nicht bei der letzten Karte des Gebers. Wertung: kārṭa (meiste Karten), dīnārī (Karo), barmīla (meiste Siebener, dann Sechser), sabʿa l-ḥayya (Karo-7), dazu die Chkobba. Ziel 21 (oder 11/31)."],"regional":[],"approx":[]},"hurrikan":{"name":"Hurrikan","origin":"Deutschland, 1930er-Jahre.","deal":"","rules":["Drei Teilrunden zu je sechs Karten; Herz ist die Bonusfarbe (Herz-7 = 1 Punkt, sechs oder mehr Herz = 1 Punkt). Ziel 16; doppeltes Spiel, wenn der Verlierer unter 8 hat."],"regional":[],"approx":[]},"cicera":{"name":"Cicera, Cirullone","origin":"Brescia (Cicera), Ligurien (Cirullone).","deal":"","rules":["Spiele, die der Cirulla/Scopone nahestehen, mit eigenen Seiten bei Pagat; ihre vollständigen Regeln konnten hier nicht gelesen werden, daher sind sie weder beschrieben noch umgesetzt."],"regional":[],"approx":[]}},"hu":{"scopa":{"name":"Scopa","origin":"Olaszország (az egész országban; a legelterjedtebb olasz kártyajáték). A 40 lapos olasz paklival játsszák (érmék, kelyhek, kardok, botok).","deal":"Az osztó minden játékosnak 3 lapot ad, és 4 lapot tesz felfordítva az asztalra; a többi a talon. Miután a 3 lapot kijátszották, mindenkinek újabb 3-at osztanak, az asztalra már nem tesznek, amíg a talon el nem fogy (két játékosnál: 6 kör). Ha 3 vagy 4 király van az asztalon, újra kell keverni és osztani.","rules":["Fogási értékek: Ász 1, 2–7 névérték, Fante (alsó) 8, Cavallo (ló/dáma) 9, Re (király) 10.","Egy lépés egy lap kijátszása. Az asztalon lévő lappal megegyező lap elviszi azt (ha több is van, te választasz). Csak ha nincs megegyező lap, vihetsz el asztali lapokból álló csoportot, amelynek összege egyenlő a lapoddal (az azonos lap elsőbbséget élvez). Különben a lap az asztalon marad.","A fogás kötelező, ha lehetséges; hogy melyik lapot játszod ki, az szabad.","Ha az asztal összes lapját elviszed, az scopa (seprés, 1 pont). A kéz utolsó lapjával végzett fogás sosem scopa. A végén az asztalon maradt lapokat az utoljára fogó játékos viszi el.","A leosztás pontozása: seprések; Carte (a legtöbb lap); Denari (a legtöbb érme); Settebello (az érmék hetese); Primiera (a legjobb primiera: színenként egy lap, értékek 7=21, 6=18, Ász=16, 5=15, 4=14, 3=13, 2=12, figurák=10; akinek valamelyik színe hiányzik, nem pontozhatja). Döntetlen nem ér pontot.","11 pontig játsszák (megegyezés szerint 21 vagy 31); ha mindkét fél túllépi a célt ugyanabban a leosztásban, a magasabb pontszám nyer; döntetlennél újabb leosztást játszanak.","Két játékosnál az osztó ellenfele nyit, és az osztás minden leosztásban váltakozik."],"regional":["Az északkeleti országrészben francia színű lapokat használnak király, dáma, alsó figurákkal.","Regionális primiera-skálák: egyes vidékeken a 2–7 névértéken számít, az ász 5½, a figurák ½.","Opcionális: Re bello (az érmék királya +1) és Napola (A-2-3… érmékben) — opcióként elérhetők.","A „Chiamarsi fuori” (a cél bejelentése a leosztás vége előtt) nincs megvalósítva."],"approx":[]},"scopone":{"name":"Scopone 9+4 (Wikipédia: „scientifico”)","origin":"Olaszország. A négyfős, párosával játszott változat (a partnerek szemben ülnek), az elején 4 lappal az asztalon.","deal":"Minden játékos 9 lapot kap, és 4 lap kerül felfordítva az asztalra (36 + 4 = 40). Ha 3 vagy 4 király van az asztalon, újra kell keverni és osztani. Az osztótól jobbra ülő játékos nyit; az óramutató járásával ellentétes irányban játszanak.","rules":["A fogások, a seprések, az utolsó kéz szabálya és a pontozás ugyanúgy működik, mint a Scopában; a nyert lapok a páros közös kupacába kerülnek.","Az utolsó lappal végzett seprés nem számít (egy opció engedélyezheti).","Cél: 11 pont (opcionálisan 21); ha mindkét oldal túllépi ugyanabban a leosztásban, a magasabb pontszám nyer; döntetlennél további leosztásokat játszanak."],"regional":["⚠ VITATOTT NÉV: a Pagat és egy olasz útmutató (Aranzulla) a 9+4-et „Scopone”-nak, az üres asztalos, 10 lapos játékot „Scopone scientifico”-nak nevezi; az olasz és az angol Wikipédia fordítva rendeli hozzá (scientifico = 9 lap + 4 az asztalon; a 10 lapos játék a „Scopone a 10 carte”). A játszott szabályok a névtől függetlenül ugyanazok; a szövetség szabálykönyvét nem lehetett megnézni. A változatot ezért itt a lapok száma szerint nevezzük.","Egyes forrásokban (olasz Wikipédia) a cél 21; a Pagatnál 11 (itt ez az alapértelmezés, a 21 opció)."],"approx":["⚠ A szabályok a forrásokat követik; csak a NÉV (Scopone / Scopone scientifico) tér el a források között — lásd „Regionális eltérések”."]},"scopone_s":{"name":"Scopone 10 lappal, üres asztal (Pagat: „scientifico”)","origin":"Olaszország. A család „intellektuális” tagja: mind a 40 lapot kiosztják (fejenként 10), az asztal üresen indul, és a figyelmes játékos számolhatja a lapokat (az összes kijátszott lap elvileg látható az emlékezetben).","deal":"Minden játékos 10 lapot kap; az asztal üresen indul. Az osztótól jobbra ülő játékos nyit; az óramutató járásával ellentétesen. A partnerek szemben ülnek (0–2. ülés az 1–3. ellen).","rules":["A fogások mint a Scopában (az azonos lap elsőbbséget élvez, különben összeg); a fogás kötelező, ha lehetséges.","A seprés (az asztal lecsupaszítása) 1 pont, de NEM a kéz utolsó lapjával. Egyes játékosok az utolsó lapra mégis seprést adnak az osztó oldalának (opció: „Az utolsó lapra tett seprés is számít”).","A leosztás pontozása: seprések plusz legfeljebb 4 pont (Carte, Denari, Settebello, Primiera). Nincs állandó leosztásonkénti összeg: egy leosztás pontszáma a seprésektől függ. A játék célja (11 vagy 21) az, amit néha „11 pontnak” hívnak.","Opciók: Re bello (+1), Napola (A-2-3… érmékben, érték = a sor hossza), Napoleone (mind a 10 érme nyer).","A játék során a 40 lap a párosok kupacaiba kerül; a végén mind a 40 a kupacokban van."],"regional":["⚠ VITATOTT NÉV: a Pagat és Aranzulla ezt a változatot (10 lap, üres asztal) „Scopone scientifico”-nak nevezi; az olasz/angol Wikipédia „Scopone a 10 carte”-nak hívja, és a „scientifico” jelzőt a 9+4-nek tartja fenn. A szabályok ugyanazok. A „9 lap és üres asztal” lehetetlen (4×9=36).","Az osztó utolsó lapjával végzett seprés vitatott (Pagat: „egyesek szerint az osztó csapata pontot kap”); alapértelmezés szerint nem számít.","Létezik Federazione Italiana Scopone (federazionescopone.it); a szabálykönyvét ehhez a projekthez nem lehetett megnézni — a Pagatot használjuk. A hivatalos cél (11 vagy 21) forrásonként változik."],"approx":["⚠ A szabályok a forrásokat követik; csak a NÉV tér el a források között — lásd „Regionális eltérések”."]},"scopa15":{"name":"Scopa a 15 (Scopa di quindici)","origin":"Olaszország. Olyan Scopa, ahol a célösszeg 15 a kijátszott lap értéke helyett. A Pagat három változatot ír le; az első kettő megvalósult.","deal":"Mint a Scopában: fejenként 3 lap, 4 az asztalon, 3-asával osztások, újraosztás 3–4 királynál.","rules":["a) változat (alapértelmezett): CSAK olyan asztali lapokat vihetsz el, amelyek a kijátszott lappal együtt pontosan 15-öt adnak. Egy lap önmagában nem fogja el a vele azonos lapot (pl. egy 5-ös elvihet egy 10-est).","b) változat: a kijátszott lap elfoghat egy azonos lapot, azonos összértékű csoportot vagy olyan csoportot, amely vele együtt 15-öt ad (nincs rögzített elsőbbség: te választasz).","A fogás kötelező, ha lehetséges; seprés, utolsó lap, pontozás és cél mint a Scopában (11/21/31)."],"regional":["A Pagat 3. változata (a második plusz az „ász mindent visz” seprésként, általában 31-ig) csak az atlaszban szerepel.","Egyesek „legkevesebb lap” szabályt játszanak (a 2. változatban) — nincs megvalósítva.","Rokona a spanyol escobának és hasonló játékoknak; itt nem ellenőriztük."],"approx":["A 3. változat és a „legkevesebb lap” szabály hiányzik (csak atlasz)."]},"apt":{"name":"Asso piglia tutto (az ász mindent visz)","origin":"Olaszország. Olyan Scopa, amelyben az ásznak különleges ereje van.","deal":"Mint a Scopában (3+4, 3-asával osztások, újraosztás 3–4 királynál).","rules":["Az az ász, amelyet olyan asztalra játszanak ki, ahol nincs másik ász, elviszi az asztal összes lapját, és scopát ér. Ha már van ász az asztalon, a kijátszott ász csak azt az ászt viszi el (több ásznál egyet választasz). Üres asztalon az ász ott marad.","A többi lapot úgy játsszák, mint a Scopában. Pontozás mint a Scopában."],"regional":["A Pagat röviden írja le a szabályt; több ász esete az asztalon nincs megadva; itt a Scopa megszokott szabálya érvényes (egy azonos ászt választasz).","Az olasz Wikipédia egy opcionális „del vile” szabályt tesz hozzá (az első játékos nem játszhat ki ászt üres asztalra) — nincs megvalósítva."],"approx":["⚠ A Pagat leírása rövid; ha több ász van az asztalon, a kijátszott ász csak egyet visz el, a te választásod szerint (értelmezés; a Pagat hallgat)."]},"dassi":{"name":"Scopa d’assi","origin":"Olaszország. Mint az Asso piglia tutto, de az ász, amely mindent visz, nem számít seprésnek; gyakran négyen játsszák párosával 9–10 lappal.","deal":"Megvalósítva: 4 játékos párosával, fejenként 10 lap, üres asztal, nincs újraosztási feltétel (olasz Wikipédia). Az osztótól jobbra ülő játékos nyit.","rules":["Az az ász, amelyet ász nélküli asztalra játszanak ki, elviszi az asztal összes lapját, és NEM számít seprésnek; ha ász van az asztalon, a kijátszott ász csak azt az ászt viszi el (mint az Asso piglia tutto-ban). Üres asztalon az ász ott marad.","Más lapok: mint a Scopában (az azonos lap elsőbbséget élvez, különben összeg); az ásztól eltérő lappal végzett seprés számít.","Pontozás: Carte, Denari, Settebello, Primiera (+ seprések), cél 11/21."],"regional":["Pagat-változatok: az üres asztalra kijátszott ász magát viszi el; újraosztás, ha ász jelenik meg a kezdő kirakásban. Nincs megvalósítva.","A Pagat a Scopa d’assit úgy határozza meg, mint az Asso piglia tutto-t seprésponta nélkül az ászra, amely mindent visz; ugyanez az ászkezelés érvényes, ha már van ász az asztalon."],"approx":["⚠ A források részletekben eltérnek (ász üres asztalon, nem ásszal végzett seprések, 9 vagy 10 lap); itt: 10 lap, az ász mindent visz (ha nincs ász az asztalon) seprés nélkül, a más lapokkal végzett seprések számítanak, az üres asztalon az ász ott marad."]},"cirulla":{"name":"Cirulla","origin":"Ligúria (Genova) és Alsó-Piemont. Hagyományosan genovai, francia színű lapokkal játsszák; itt bármilyen 40 lapos paklival.","deal":"Fejenként 3 lap és 4 az asztalon; újraosztás, ha 2 vagy több ász van az asztalon. Ha az asztal 4 lapjának összege pontosan 15 (1 seprés) vagy 30 (2 seprés), az osztó azonnal elviszi őket.","rules":["Fogások (tetszés szerint): egy azonos lap; egy azonos összegű csoport; olyan lapok, amelyek a kijátszott lappal együtt 15-öt adnak; az ász elviszi az egész asztalt, ha nincs rajta ász. Seprés = az asztal lecsupaszítása (1 pont); a végén az asztal maradéka seprés nélkül az utolsó fogóhoz kerül.","Leosztásbónuszok: három lap, összegük ≤ 9 = 3 seprés („barsega”); három azonos lap = 10 seprés („barsegon”); a kelyhek hetese (kőr) joker (matta), csak a bónuszra.","Pontozás: seprések, Carte, Denari, Settebello, Primiera, La piccola (A-2-3… érmékben, lapja 1 pont, legalább 3, legfeljebb 6), La grande (király+ló+alsó érmékben = 5). Mind a 10 érme = „cappotto”: azonnali győzelem.","Cél: 51 (alternatívaként 31/21); a leosztást mindenképp befejezik."],"regional":["A Pagat több megengedett időpontot említ a bónuszok bejelentésére (kopogás: a kör elején, osztás és első lap között, közvetlenül az osztás után).","A Cirullone (Ligúria) és a Cicera (Brescia) rokon/külön játékok — csak említve.","A versenyváltozat (cappotto négy azonos értékű lap esetén is az asztalon) hiányzik."],"approx":["⚠ A leosztásbónuszokat minden 3 lapos osztás elején automatikusan bejelentik (kopogás, blöffölés és visszavonás nélkül), mindkét játékosnál; a mattát automatikusan a legjobb eredményre választják.","⚠ „La piccola” 6-ban korlátozva és „La grande” = 5 a Pagat összefoglalója szerint; a pontos értékeket második forrás nem erősítette meg.","⚠ A kijátszott lapnál a fogás kötelező, ha foghat (a Pagat kevésbé egyértelmű)."]},"rubamazzo":{"name":"Rubamazzo (Rubamazzetto)","origin":"Olaszország. Egyszerűsített Scopa-szerű játék, amelyben az ellenfél kupacát el lehet lopni.","deal":"Fejenként 3 lap, 4 az asztalon, 3-asával osztások, amíg a talon el nem fogy. Az osztó ellenfele nyit.","rules":["Játssz ki egy lapot. Ha ugyanolyan értékű, mint egy asztali lap, elviszed (a lapodat a kupacod tetejére téve). Ha ugyanolyan értékű, mint az ellenfél kupacának felső lapja (az utoljára fogott, mindig látható), ellophatod az egész kupacot. Ha mindkettő lehetséges, te választasz.","A fogás vagy lopás kötelező, ha lehetséges; különben a lap az asztalon marad.","A végén az asztal maradéka az utolsó fogóhoz kerül; akinél több lap van, nyer (20–20 = döntetlen)."],"regional":["A helyi szabályok nagyon eltérnek (a lopó ász; ki lophat a saját kupacából; az utolsó kör szabályai).","A megnézett források (olasz Wikipédia, egy olasz útmutató) nem írnak le további kupacvédelmet vagy különleges pontokat."],"approx":["⚠ A regionális szabályok eltérőek; két forrás közös magja valósult meg. Nincs ászos változat, nincsenek extra pontok. Egyszerű MI (heurisztikus, nem Monte-Carlo)."]},"bazzica":{"name":"Scopa Bazzica","origin":"Olaszország (két játékos).","deal":"","rules":["Közvetlenül a 3 lapos osztás után kombinációkat lehet bejelenteni: Bazzica (három lap, összegük ≤ 9, a figurák 10) = 3 pont; Bazzicotto (három azonos értékű lap) = 10 pont. Csak a jobb számít; a bazzicánál az alacsonyabb összeg nyer, a bazzicottónál az alacsonyabb érték. Játék 21 vagy 31 pontig."],"regional":[],"approx":[]},"scalette":{"name":"Scopa scalettével / Napola","origin":"Olaszország.","deal":"","rules":["Érmesorok: alsó létra (A-2-3, 3 pont, a lóig = 9 meghosszabbítható) és felső létra (király-ló-alsó, 5 pont, lefelé a 2-esig = 11 meghosszabbítható). Minden érme = „Scala”: győzelem. Napola: A-2-3… érmékben, lapja egy pont."],"regional":["A Napola és a Re bello a Scopa/Scopone opciói; a scalette csak az atlaszban szerepel."],"approx":[]},"sbarazzina":{"name":"Sbarazzina és Piva","origin":"Emilia (Olaszország).","deal":"","rules":["Sbarazzina: az ász mindent visz seprés nélkül; a Re bello egy pont; bazzica 2 pont (minden érték különböző) vagy 3 (párral); drill = 7; játék 41 pontig. Piva: kétszemélyes változat piacenzai lapokkal, amelyben a botok kettesének elvitele −5 pont; játék 21 vagy 31 pontig, a pontszám negatív is lehet."],"regional":[],"approx":[]},"corsa":{"name":"Korzikai Scopa","origin":"Korzika.","deal":"","rules":["36 lapos pakli (kettesek nélkül). Két játékos: 3,3,3,3,4,4 lapos osztások; négy játékos állandó párokban. A fogás nem kötelező. Játék 21 (vagy 16/11) pontig."],"regional":[],"approx":[]},"chkobba":{"name":"Chkobba","origin":"Tunézia; Franciaországban is népszerű.","deal":"","rules":["Francia 40 lapos pakli (8, 9, 10 nélkül; alsó 9, dáma 8). A felvágott lapot meg lehet tartani vagy az asztalra lehet tenni. A fogás kötelező; chkobba = az asztal lecsupaszítása, nem az osztó utolsó lapján. Pontozás: kārṭa (a legtöbb lap), dīnārī (káró), barmīla (a legtöbb hetes, majd hatos), sabʿa l-ḥayya (káró hetes), plusz a chkobba. Cél 21 (vagy 11/31)."],"regional":[],"approx":[]},"hurrikan":{"name":"Hurrikan","origin":"Németország, az 1930-as évek.","deal":"","rules":["Három részosztás hat-hat lappal; a kőr a bónuszszín (kőr hetes = 1 pont, hat vagy több kőr = 1 pont). Cél 16; dupla játék, ha a vesztes 8 alatt van."],"regional":[],"approx":[]},"cicera":{"name":"Cicera, Cirullone","origin":"Brescia (Cicera), Ligúria (Cirullone).","deal":"","rules":["A Cirullához/Scoponéhoz közel álló játékok, külön oldalakkal a Pagaton; teljes szabályaikat itt nem lehetett elolvasni, ezért sem leírva, sem megvalósítva nincsenek."],"regional":[],"approx":[]}}};
const DECK_L10N = {"fr":["Le jeu italien compte 40 cartes : quatre couleurs (Denari/deniers ♦, Coppe/coupes ♥, Spade/épées ♠, Bastoni/bâtons ♣) × dix rangs (As, 2–7, Fante, Cavallo, Re). Les 8, 9, 10 sont les figures.","Les signes de cette application sont des dessins originaux (SVG) et ne reproduisent aucun modèle régional (napolitain, piacentin, sicilien…) ; ils visent à être reconnaissables plutôt qu’« authentiques ». Si vous ne connaissez pas ce jeu, choisissez « Françaises » dans l’en-tête : ♦ deniers, ♥ coupes, ♠ épées, ♣ bâtons ; Fante=V, Cavallo=D, Re=R.","La valeur de prise est le rang (As=1 … Roi=10). La primiera utilise une autre échelle (colonne de droite) : la meilleure carte de chaque couleur, additionnées ; un camp auquel manque une couleur ne peut pas marquer la primiera."],"it":["Il mazzo italiano ha 40 carte: quattro semi (Denari ♦, Coppe ♥, Spade ♠, Bastoni ♣) × dieci valori (Asso, 2–7, Fante, Cavallo, Re). L’8, il 9 e il 10 sono le figure.","I segni di questa app sono disegni originali (SVG) e non riproducono alcun modello regionale (napoletano, piacentino, siciliano…); sono pensati per essere riconoscibili più che «autentici». Se non conosci il mazzo, scegli «Francesi» nell’intestazione: ♦ denari, ♥ coppe, ♠ spade, ♣ bastoni; Fante=J, Cavallo=Q, Re=K.","Il valore di presa è il valore della carta (Asso=1 … Re=10). La primiera usa un’altra scala (colonna di destra): la migliore carta di ogni seme, sommate; chi non ha un seme non può segnare la primiera."],"es":["La baraja italiana tiene 40 cartas: cuatro palos (Denari/oros ♦, Coppe/copas ♥, Spade/espadas ♠, Bastoni/bastos ♣) × diez valores (As, 2–7, Fante, Cavallo, Re). El 8, el 9 y el 10 son las figuras.","Los signos de esta aplicación son dibujos originales (SVG) y no reproducen ningún patrón regional (napolitano, piacentino, siciliano…); buscan ser reconocibles más que «auténticos». Si no conoces la baraja, elige «Franceses» en la cabecera: ♦ oros, ♥ copas, ♠ espadas, ♣ bastos; Fante=J, Cavallo=Q, Re=K.","El valor de captura es el valor de la carta (As=1 … Rey=10). La primiera usa otra escala (columna de la derecha): la mejor carta de cada palo, sumadas; un bando al que le falte un palo no puede puntuar la primiera."],"pt":["O baralho italiano tem 40 cartas: quatro naipes (Denari/ouros ♦, Coppe/copas ♥, Spade/espadas ♠, Bastoni/paus ♣) × dez valores (Ás, 2–7, Fante, Cavallo, Re). O 8, o 9 e o 10 são as figuras.","Os sinais desta aplicação são desenhos originais (SVG) e não reproduzem nenhum padrão regional (napolitano, piacentino, siciliano…); destinam-se a ser reconhecíveis mais do que «autênticos». Se não conhece o baralho, escolha «Franceses» no cabeçalho: ♦ ouros, ♥ copas, ♠ espadas, ♣ paus; Fante=J, Cavallo=Q, Re=K.","O valor de captura é o valor da carta (Ás=1 … Rei=10). A primiera usa outra escala (coluna da direita): a melhor carta de cada naipe, somadas; um lado a que falte um naipe não pode pontuar a primiera."],"de":["Das italienische Blatt hat 40 Karten: vier Farben (Denari/Münzen ♦, Coppe/Kelche ♥, Spade/Schwerter ♠, Bastoni/Stäbe ♣) × zehn Werte (Ass, 2–7, Fante, Cavallo, Re). Die 8, 9 und 10 sind die Bildkarten.","Die Zeichen in dieser App sind eigene Zeichnungen (SVG) und geben kein regionales Blatt wieder (neapolitanisch, piacentinisch, sizilianisch…); sie sollen gut erkennbar sein statt „authentisch“. Wenn Sie das Blatt nicht kennen, wählen Sie in der Kopfzeile „Französisch“: ♦ Münzen, ♥ Kelche, ♠ Schwerter, ♣ Stäbe; Fante=J, Cavallo=Q, Re=K.","Der Nehmwert ist der Rang (Ass=1 … König=10). Die Primiera verwendet eine andere Skala (rechte Spalte): die beste Karte jeder Farbe, zusammengezählt; wem eine Farbe fehlt, kann keine Primiera werten."],"hu":["Az olasz pakli 40 lapos: négy szín (Denari/érmék ♦, Coppe/kelyhek ♥, Spade/kardok ♠, Bastoni/botok ♣) × tíz rang (ász, 2–7, Fante, Cavallo, Re). A 8-as, 9-es és 10-es a figura.","Az alkalmazás jelei saját rajzok (SVG), és nem másolnak egyetlen regionális mintát sem (nápolyi, piacenzai, szicíliai…); inkább felismerhetők, mint „hitelesek”. Ha nem ismered a paklit, válaszd a fejlécben a „Francia” lehetőséget: ♦ érmék, ♥ kelyhek, ♠ kardok, ♣ botok; Fante=J, Cavallo=Q, Re=K.","A fogási érték a rang (ász=1 … király=10). A primiera másik skálát használ (jobb oldali oszlop): minden szín legjobb lapja, összeadva; akinek hiányzik egy szín, nem pontozhatja a primierát."]};
const ABOUT_L10N = {"fr":[["Qu’est-ce que c’est","Un atlas de la famille Scopa/Scopone avec le jeu italien de 40 cartes. Huit variantes se jouent contre un adversaire IA local ; les autres sont décrites dans l’atlas. Le tout tient dans un seul fichier HTML hors ligne."],["Honnêteté","Chaque variante est marquée « fidèle aux règles citées » ou « ⚠ approximation », avec ce qui manque. Les règles ont été vérifiées sur Pagat.com (et sur le Wikipédia italien / des guides italiens là où Pagat ne les décrit pas) ; le règlement de la Federazione Italiana Scopone n’a pas pu être lu. Quand les sources diffèrent, la fiche indique quelle version a été implémentée."],["L’IA","L’IA est didactique, ce n’est pas un LLM. Le niveau « Heuristique » note chaque coup selon la valeur des cartes prises et estime le risque de scopa de l’adversaire à partir des cartes pas encore vues (il compte les cartes jouées). Le niveau « Monte-Carlo » simule des dizaines de répartitions possibles des cartes non vues (déterminisation) avec une politique heuristique et choisit le coup au meilleur résultat moyen. L’IA ne voit pas votre main : elle ne reçoit que la table, sa propre main, les piles et le nombre de cartes des autres (exception : l’option d’apprentissage « Montrer les mains de l’IA » ne fait que vous les afficher)."],["Confidentialité","Aucun réseau, compte ou télémétrie. localStorage est utilisé (facultativement) pour la langue/le jeu de cartes/la dernière variante et les statistiques locales ; l’application fonctionne sans. Le mélange utilise crypto.getRandomValues ; une graine saisie par vous rend les donnes reproductibles."],["Auteur","Alexio — Alexandru-Ionuț Chiuță · alexio@trom.tf"]],"it":[["Che cos’è","Un atlante della famiglia Scopa/Scopone con il mazzo italiano da 40 carte. Otto varianti si giocano contro un avversario IA locale; le altre sono descritte nell’atlante. Tutto è in un unico file HTML offline."],["Onestà","Ogni variante è contrassegnata come «fedele alle regole citate» o «⚠ approssimazione», con ciò che manca. Le regole sono state verificate su Pagat.com (e su Wikipedia italiana / guide italiane dove Pagat non le descrive); il regolamento della Federazione Italiana Scopone non ha potuto essere letto. Dove le fonti differiscono, la scheda indica quale versione è stata implementata."],["L’IA","L’IA è didattica, non un LLM. Il livello «Euristico» valuta ogni mossa in base al valore delle carte prese e stima il rischio di scopa dell’avversario dalle carte non ancora viste (conta le carte uscite). Il livello «Monte-Carlo» simula decine di possibili distribuzioni delle carte non viste (determinizzazione) con una politica euristica e sceglie la mossa con il miglior risultato medio. L’IA non vede la tua mano: riceve solo il tavolo, la propria mano, i mucchi e il numero di carte degli altri (eccezione: l’opzione di apprendimento «Mostra le mani dell’IA» le mostra soltanto a te)."],["Privacy","Nessuna rete, account o telemetria. localStorage viene usato (facoltativamente) per lingua/mazzo/ultima variante e statistiche locali; l’app funziona anche senza. Il mescolamento usa crypto.getRandomValues; un seed inserito da te rende le distribuzioni riproducibili."],["Autore","Alexio — Alexandru-Ionuț Chiuță · alexio@trom.tf"]],"es":[["Qué es","Un atlas de la familia Scopa/Scopone con la baraja italiana de 40 cartas. Ocho variantes se juegan contra un rival de IA local; el resto se describen en el atlas. Todo está en un único archivo HTML sin conexión."],["Honestidad","Cada variante está marcada como «fiel a las reglas citadas» o «⚠ aproximación», con lo que falta. Las reglas se comprobaron en Pagat.com (y en la Wikipedia italiana / guías italianas donde Pagat no las describe); no se pudo leer el reglamento de la Federazione Italiana Scopone. Donde las fuentes difieren, la ficha indica qué versión se implementó."],["La IA","La IA es didáctica, no un LLM. El nivel «Heurístico» puntúa cada jugada según el valor de las cartas capturadas y estima el riesgo de escoba del rival a partir de las cartas aún no vistas (cuenta las cartas jugadas). El nivel «Monte-Carlo» simula decenas de posibles reparticiones de las cartas no vistas (determinización) con una política heurística y elige la jugada con mejor resultado medio. La IA no ve tu mano: solo recibe la mesa, su propia mano, los montones y el número de cartas de los demás (excepción: la opción de aprendizaje «Mostrar manos de la IA» solo te las muestra a ti)."],["Privacidad","Sin red, cuenta ni telemetría. Se usa localStorage (opcionalmente) para idioma/baraja/última variante y estadísticas locales; la aplicación funciona sin él. El barajado usa crypto.getRandomValues; una semilla que introduzcas hace los repartos reproducibles."],["Autor","Alexio — Alexandru-Ionuț Chiuță · alexio@trom.tf"]],"pt":[["O que é","Um atlas da família Scopa/Scopone com o baralho italiano de 40 cartas. Oito variantes jogam-se contra um adversário de IA local; as restantes estão descritas no atlas. Tudo está num único ficheiro HTML offline."],["Honestidade","Cada variante está assinalada como «fiel às regras citadas» ou «⚠ aproximação», com o que falta. As regras foram verificadas no Pagat.com (e na Wikipédia italiana / guias italianos onde o Pagat não as descreve); não foi possível ler o regulamento da Federazione Italiana Scopone. Onde as fontes diferem, a ficha indica que versão foi implementada."],["A IA","A IA é didática, não um LLM. O nível «Heurístico» pontua cada jogada pelo valor das cartas capturadas e estima o risco de vassoura do adversário a partir das cartas ainda não vistas (conta as cartas jogadas). O nível «Monte-Carlo» simula dezenas de possíveis distribuições das cartas não vistas (determinização) com uma política heurística e escolhe a jogada com melhor resultado médio. A IA não vê a sua mão: recebe apenas a mesa, a sua própria mão, os montes e o número de cartas dos outros (exceção: a opção de aprendizagem «Mostrar mãos da IA» limita-se a mostrá-las a si)."],["Privacidade","Sem rede, conta nem telemetria. O localStorage é usado (opcionalmente) para idioma/baralho/última variante e estatísticas locais; a aplicação funciona sem ele. A baralhação usa crypto.getRandomValues; uma semente que introduza torna as distribuições reproduzíveis."],["Autor","Alexio — Alexandru-Ionuț Chiuță · alexio@trom.tf"]],"de":[["Was es ist","Ein Atlas der Scopa/Scopone-Familie mit dem italienischen 40-Karten-Blatt. Acht Varianten sind gegen einen lokalen KI-Gegner spielbar; die übrigen sind im Atlas beschrieben. Alles steckt in einer einzigen Offline-HTML-Datei."],["Ehrlichkeit","Jede Variante ist als „treu zu den zitierten Regeln“ oder als „⚠ Näherung“ mit dem Fehlenden gekennzeichnet. Die Regeln wurden bei Pagat.com geprüft (und in der italienischen Wikipedia / italienischen Ratgebern, wo Pagat sie nicht beschreibt); das Regelwerk der Federazione Italiana Scopone konnte nicht gelesen werden. Wo die Quellen abweichen, nennt der Eintrag, welche Fassung umgesetzt wurde."],["Die KI","Die KI ist didaktisch, kein LLM. Die Stufe „Heuristisch“ bewertet jeden Zug nach dem Wert der genommenen Karten und schätzt das Besenrisiko des Gegners aus den noch nicht gesehenen Karten (sie zählt gespielte Karten). Die Stufe „Monte-Carlo“ simuliert Dutzende mögliche Verteilungen der ungesehenen Karten (Determinisierung) mit einer heuristischen Strategie und wählt den Zug mit dem besseren Durchschnittsergebnis. Die KI sieht Ihre Hand nicht: Sie erhält nur den Tisch, ihre eigene Hand, die Stapel und die Kartenzahl der anderen (Ausnahme: Die Lernoption „KI-Hände zeigen“ zeigt sie nur Ihnen)."],["Datenschutz","Kein Netzwerk, kein Konto, keine Telemetrie. localStorage wird (optional) für Sprache/Blatt/zuletzt gewählte Variante und lokale Statistiken genutzt; die App funktioniert auch ohne. Das Mischen verwendet crypto.getRandomValues; ein von Ihnen eingegebener Seed macht die Verteilungen reproduzierbar."],["Autor","Alexio — Alexandru-Ionuț Chiuță · alexio@trom.tf"]],"hu":[["Mi ez","A Scopa/Scopone család atlasza a 40 lapos olasz paklival. Nyolc változat játszható helyi MI-ellenfél ellen; a többit az atlasz írja le. Az egész egyetlen offline HTML-fájl."],["Őszinteség","Minden változat meg van jelölve: „hű az idézett szabályokhoz” vagy „⚠ közelítés” azzal, hogy mi hiányzik. A szabályokat a Pagat.com oldalon ellenőriztük (és az olasz Wikipédián / olasz útmutatókban, ahol a Pagat nem írja le őket); a Federazione Italiana Scopone szabálykönyvét nem lehetett elolvasni. Ahol a források eltérnek, a lap megmondja, melyik változatot valósítottuk meg."],["Az MI","Az MI oktatási célú, nem LLM. A „Heurisztikus” szint minden lépést az elvitt lapok értéke szerint pontoz, és a még nem látott lapokból becsüli az ellenfél seprési kockázatát (számolja a kijátszott lapokat). A „Monte-Carlo” szint a nem látott lapok több tucat lehetséges eloszlását szimulálja (determinizálás) heurisztikus stratégiával, és a jobb átlageredményű lépést választja. Az MI nem látja a te kezedet: csak az asztalt, a saját kezét, a kupacokat és a többiek lapszámát kapja (kivétel: a „MI kezének mutatása” tanulási opció csak neked mutatja meg őket)."],["Adatvédelem","Nincs hálózat, fiók vagy telemetria. A localStorage-t (opcionálisan) a nyelvhez/paklihoz/utolsó változathoz és a helyi statisztikákhoz használjuk; az alkalmazás enélkül is működik. A keverés a crypto.getRandomValues-t használja; az általad megadott seed reprodukálhatóvá teszi az osztásokat."],["Szerző","Alexio — Alexandru-Ionuț Chiuță · alexio@trom.tf"]]};

function startGame(setup, net) {

}

}

    else if (ev.type === 'handBonus') log(T('log.handBonus', { p: playerName(ev.p), n: ev.pts }));

}

/* după orice schimbare de stare: ia măsuri în funcție de cine e la rând */
function afterChange(first) {

  renderPlay();
  if (G.phase !== 'play') return;
  if (G.st.over) { endHand(); return; }
  if (G.st.turn === (G.net ? G.net.me : 0)) { setStatus(T('play.yourTurn')); renderPlay(); focusDefault(); }
  else if (G.net) { setStatus(G.net.up ? T('net.wait') : T('net.lost')); renderPlay(); }

}

  g.busy = true; setStatus(T('play.aiThinking')); renderPlay();
  const delay = reduceMotion() ? 120 : (g.level === 'mc' ? 350 : 650);
  aiTimer = setTimeout(function () {
    aiTimer = null; if (G !== g || g.phase !== 'play') return;
    try {
      let mv;
      if (g.kind === 'ruba') mv = SC.RUBA.choose(SC.RUBA.observe(g.st, g.st.turn), g.aiRng);
      else mv = SC.chooseMove(SC.observe(g.st, g.st.turn), g.level, g.aiRng, g.samples);
      g.busy = false; doMove(mv);
    } catch (e) { /* watchdog: dacă AI-ul aruncă excepție, joacă o mutare legală oarecare ca jocul să nu rămână blocat */
      g.busy = false;
      try { const L = g.kind === 'ruba' ? SC.RUBA.moves(g.st) : SC.legalMoves(g.st); doMove(L[g.aiRng.int(L.length)]); }

}
function doMove(mv) {
  const g = G, st = g.st, p = st.turn, nm = playerName(p);

    if (mv.kind === 'place') log(T('log.place', { p: nm, c: cardName(mv.card) }));
    else if (mv.kind === 'table') log(T('log.take', { p: nm, c: cardName(mv.card), t: cardName(mv.target) }));
    else log(nm + ': ' + cardName(mv.card) + ' — ' + T('ruba.steal') + ' (' + st.piles[1 - p].length + ')');
    SC.RUBA.apply(st, mv, true);
  } else {
    if (!mv.take.length) log(T('log.place', { p: nm, c: cardName(mv.card) }));
    else log(T('log.take', { p: nm, c: cardName(mv.card), t: sortTable(mv.take).map(cardName).join(' + ') }));

/* ---------- selecția jucătorului ---------- */
function optionsFor(card) {
  const g = G, st = g.st;

    return SC.RUBA.moves(st, 0).filter(m => m.card === card).map(m => ({
      ids: m.kind === 'table' ? [m.target] : [], mv: m,
      label: m.kind === 'table' ? T('ruba.take') + ': ' + cardName(m.target) : m.kind === 'steal' ? T('ruba.steal') + ' (' + st.piles[1].length + ' ' + T('play.cards') + ')' : T('ruba.place'),
      parts: m.kind === 'table' ? [m.target] : []
    }));
  }
  const takes = SC.legalTakes(st.rules, card, st.table);
  if (!takes.length) return [{ ids: [], mv: { card, take: [] }, label: T('btn.place'), parts: [], place: true }];
  return takes.map(t => ({ ids: t, mv: { card, take: t }, label: T('play.optLabel') + ': ' + sortTable(t).map(cardName).join(' + '), parts: sortTable(t), sweep: t.length === st.table.length }));
}
function selectCard(id) {

  const g = G;

  const opts = optionsFor(id);
  g.sel = { card: id, options: opts, idx: opts.length === 1 ? 0 : -1, tsel: new Set() };
  if (opts.length === 1) setStatus(opts[0].place ? T('play.noCap') : T('play.opt1', { t: opts[0].label.replace(/^[^:]*: /, '') }));

}

}

  if (!selValid()) { setStatus(T('play.invalid', { c: cardFull(s.card) })); renderPlay(); return; }
  playMove(s.options[s.idx].mv);
}

}

  if (s.tsel.has(id)) s.tsel.delete(id); else s.tsel.add(id);

  let exact = -1, any = false;
  s.options.forEach((o, i) => {
    const set = new Set(o.ids); let sub = true; for (const x of s.tsel) if (!set.has(x)) sub = false;

  const my = sortIds(st.hands[g.net ? g.net.me : 0]); const can = humanTurn();

}
function optLabelNode(o, i) {

}
function actionEl() {

/* sugestie: aceeași euristică simplă pe care o folosește AI-ul, aplicată DOAR pe ce vede jucătorul; RNG separat, ca să nu schimbe amestecul sau mutările AI */
function showHint() {
  if (!humanTurn() || G.net) return;
  const g = G; let mv;
  try {
    const rng = SC.makeRNG('hint|' + g.handNo + '|' + g.log.length);
    mv = g.kind === 'ruba' ? SC.RUBA.choose(SC.RUBA.observe(g.st, 0), rng) : SC.chooseMove(SC.observe(g.st, 0), 'h', rng, 0);
  } catch (e) { return; }
  if (!mv) return;
  if (!(g.sel && g.sel.card === mv.card)) selectCard(mv.card); /* selectCard pe aceeași carte ar confirma mutarea: evitat */
  const s = g.sel; if (!s) return;
  let msg;
  if (g.kind === 'ruba') {
    const i = s.options.findIndex(o => o.mv.kind === mv.kind && o.mv.target === mv.target); if (i >= 0) s.idx = i;
    msg = T('hint.play', { c: cardFull(mv.card) }) + (mv.kind === 'table' ? ' ' + T('ruba.take') + ': ' + cardName(mv.target) : mv.kind === 'steal' ? ' ' + T('ruba.steal') : '');
  } else {
    const key = a => a.slice().sort().join(',');
    const i = s.options.findIndex(o => key(o.ids) === key(mv.take || [])); if (i >= 0) { s.idx = i; s.tsel = new Set(); }
    msg = mv.take && mv.take.length ? T('hint.take', { c: cardFull(mv.card), t: sortTable(mv.take).map(cardName).join(' + ') }) : T('hint.place', { c: cardFull(mv.card) });
  }

}
function endEl() {
  const g = G;
  if (g.kind === 'ruba') {
    const a = g.st.piles[0].length, b = g.st.piles[1].length;
    return h('div', { class: 'endpanel' }, h('div', { class: 'big' }, g.result.winner === 0 ? T('end.youWin') : g.result.winner === 1 ? T('end.youLose') : T('end.draw')),
      h('p', null, T('play.you') + ': ' + a + ' ' + T('play.cards') + ' · ' + T('play.ai') + ': ' + b + ' ' + T('play.cards')),
      h('div', { class: 'row' }, h('button', { class: 'btn pri', type: 'button', 'data-fk': 'nm', onclick: () => { g.dealer = 1 - g.dealer; newRuba(); afterChange(); } }, T('btn.newmatch')), h('button', { class: 'btn', type: 'button', onclick: backToSetup }, T('btn.setup'))));
  }
  const sc = g.lastScore, tm = sc.teams, rules = g.rules;
  const rows = [];
  const add = (k, f) => { const a = f(tm[0]), b = f(tm[1]); if (a || b || ['scope', 'carte', 'denari', 'sette', 'prim'].includes(k)) rows.push(h('tr', null, h('td', null, T('sc.' + k)), h('td', null, String(a)), h('td', null, String(b)))); };
  add('scope', t => t.scopeOnly); if (rules.cirulla) add('handBonus', t => t.handBonus);
  add('carte', t => t.carte); add('denari', t => t.denari); add('sette', t => t.sette); add('prim', t => t.prim);
  if (rules.opts.reBello) add('reBello', t => t.reBello); if (rules.opts.napola) add('napola', t => t.napola);
  if (rules.cirulla) { add('piccola', t => t.piccola); add('grande', t => t.grande); }
  rows.push(h('tr', { class: 'tot' }, h('td', null, T('sc.total')), h('td', null, String(tm[0].total)), h('td', null, String(tm[1].total))));
  rows.push(h('tr', { class: 'tot' }, h('td', null, T('sc.match')), h('td', null, String(g.match.scores[0])), h('td', null, String(g.match.scores[1]))));
  const prim = t => t.primVal === null ? T('sc.noPrim') : String(t.primVal);
  const mi = g.net ? g.net.me : 0, ti = g.net ? 1 - mi : 1;
  const det = h('p', { class: 'help' }, T('sc.colYou') + ': ' + T('sc.detail', { c: tm[mi].cards, d: tm[mi].den, p: prim(tm[mi]) }) + ' · ' + T('sc.colOpp') + ': ' + T('sc.detail', { c: tm[ti].cards, d: tm[ti].den, p: prim(tm[ti]) }));
  const over = g.phase === 'matchEnd';
  return h('div', { class: 'endpanel' },
    h('div', { class: 'big' }, over ? (g.match.winner === (g.net ? g.net.me : 0) ? T('end.youWin') : T('end.youLose')) : T('end.hand')),
    sc.instant !== null ? h('p', null, T('end.instant')) : null,
    h('table', null, h('thead', null, h('tr', null, h('th', null, ''), h('th', null, teamName(0)), h('th', null, teamName(1)))), h('tbody', null, rows)), det,
    h('div', { class: 'row' },
      over ? (g.net ? h('p', { class: 'help' }, T('net.over')) : h('button', { class: 'btn pri', type: 'button', 'data-fk': 'nm', onclick: () => startGame(g.setup) }, T('btn.newmatch')))

function memEl() {
  const g = G; if (!g || !g.setup.showMem || g.kind !== 'std') return null;
  const un = new Set(SC.unseenOf(SC.observe(g.st, g.net ? g.net.me : 0)));
  const wrap = h('div', { class: 'panel' }, h('b', null, T('mem.title')), h('div', { class: 'legend' }, T('mem.legend')));
  const grid = h('div', { class: 'mem', role: 'list' });
  for (let s = 0; s < 4; s++) for (let r = 1; r <= 10; r++) { const id = s * 10 + r - 1; grid.appendChild(h('span', { role: 'listitem', class: (un.has(id) ? '' : 'out ') + 'f' + s, 'aria-label': cardFull(id) + (un.has(id) ? '' : ' —') }, rankName(r).slice(0, 2) + SUIT_SYM[s])); }
  wrap.appendChild(grid); return wrap;
}

/* ===== JOC ÎN DOI PE REȚEA (FFF.p2p, fără server): doar variantele în doi jucători (motorul rămâne neschimbat) ===== */
const NET_VARIANTS = ['scopa', 'scopa15', 'apt', 'cirulla'];
const hasNet = () => !!(window.FFF && FFF.p2p && typeof FFF.p2p.dialog === 'function' && typeof FFF.p2p.lockstep === 'function');
function netStart() {
  const v = $('#sv-variant'); if (!v || !NET_VARIANTS.includes(v.value)) { const m = $('#sv-netmsg'); if (m) m.textContent = T('net.pick2'); return; }
  const setup = readSetup();
  FFF.p2p.dialog({ title: T('net.title'), onOpen: sess => netOpen(sess, setup) });
}
function netHash() {
  if (!G || !G.net || !G.st) return '';
  const s = G.st;
  return [G.handNo, s.turn, s.plays, s.table.slice().sort((a, b) => a - b).join('.'), s.hands.map(x => x.slice().sort((a, b) => a - b).join('.')).join('|'), G.match.scores.join('-')].join('/');
}
function netOpen(sess, setup) {
  if (G && G.net && G.net.sess === sess) return; /* 'open' poate fi emis de două ori de același canal */
  const host = sess.role === 'host';
  const net = { sess, me: host ? 0 : 1, host, up: true, log: [], ls: null, setupPub: null };
  net.ls = FFF.p2p.lockstep(sess, {
    snapshot: () => ({ setup: net.setupPub, moves: net.log.slice() }),
    onState: (state, info) => {
      if (host && !net.setupPub) net.setupPub = { variant: setup.variant, opts: setup.opts, seed: 'net-' + info.seed };
      const st = state && state.setup ? state : { setup: net.setupPub, moves: [] };
      if (!st.setup || !NET_VARIANTS.includes(st.setup.variant)) { net.up = false; try { sess.close('local'); } catch (e) { /* ignorat */ } return; }
      net.setupPub = st.setup;
      netBegin(net, st.setup, Array.isArray(st.moves) ? st.moves : []);
    },
    onMove: (mv, info) => netMove(net, mv, info),
    hash: netHash,
    onError: () => { if (G && G.net === net) { G.busy = false; setStatus(T('net.rej')); renderPlay(); } }
  });
  sess.on('lost', () => { if (G && G.net === net && net.up) { setStatus(T('net.weak')); renderPlay(); } });
  sess.on('recovered', () => { if (G && G.net === net && net.up) { setStatus(G.st.turn === net.me ? T('play.yourTurn') : T('net.wait')); renderPlay(); } });
  sess.on('close', () => { net.up = false; if (G && G.net === net) { G.busy = false; setStatus(T('net.lost')); renderPlay(); } });
}
function netBegin(net, pub, moves) {
  startGame({ variant: pub.variant, opts: pub.opts, level: 'h', seed: pub.seed, showHands: false, showMem: prefs.showMem }, net);
  net.log = [];
  G.net = net;
  for (const mv of moves) { const r = netMove(net, mv, { from: G.st.turn === 0 ? 'host' : 'guest', replay: true }); if (typeof r === 'string') break; }
  G.busy = false; setStatus(G.phase === 'play' && G.st.turn !== net.me ? T('net.wait') : (net.host ? T('net.hostIs') : T('net.guestIs')));
  renderPlay();
}
/* aplică (identic la ambii jucători) o mutare confirmată de gazdă; întoarce un șir dacă e ilegală */
function netMove(net, mv, info) {
  if (!G || G.net !== net || !mv || typeof mv !== 'object') return 'nogame';
  if (mv.k === 'n') {
    if (G.phase !== 'handEnd') return 'phase';
    net.log.push({ k: 'n' }); G.busy = false; newHand(); afterChange(); return;
  }
  if (mv.k !== 'm') return 'bad';

  if (G.phase !== 'play' || G.st.over || G.st.turn !== from) return 'turn';
  const card = Number(mv.card), take = Array.isArray(mv.take) ? mv.take.map(Number) : null;
  if (!take || !Number.isInteger(card)) return 'bad';
  const key = a => a.slice().sort((x, y) => x - y).join(',');
  const legal = SC.legalMoves(G.st, from).find(m => m.card === card && key(m.take) === key(take));
  if (!legal) return 'illegal';
  net.log.push({ k: 'm', card: legal.card, take: legal.take.slice() }); G.busy = false;
  doMove(legal);
}
function netSend(mv) {
  const net = G && G.net; if (!net || !net.up || !net.ls) return;

  net.ls.move(mv).catch(() => { if (G && G.net === net) { G.busy = false; setStatus(T('net.rej')); renderPlay(); } });
}
function netClose() {
  const net = G && G.net; if (!net) return;
  net.up = false; try { net.ls.stop(); } catch (e) { /* ignorat */ } try { net.sess.close('local'); } catch (e) { /* ignorat */ }
}
function playMove(mv) { if (G.net) netSend({ k: 'm', card: mv.card, take: mv.take.slice() }); else doMove(mv); }

/* ---------- tastatură ---------- */
document.addEventListener('keydown', function (e) {
  if (view !== 'play' || !G || G.phase !== 'play') return;
  const t = e.target, tag = t && t.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;

    const items = $$('button.card', grp); const i = items.indexOf(t);

    const o = s.options[s.idx]; setStatus(T('play.opt1', { t: o.label.replace(/^[^:]*: /, '') })); renderPlay();

/* ---------- inițializare ---------- */
function init() {
  loadStore(); lang = detectLang(); deckMode = prefs.deck;
  document.body.insertAdjacentHTML('afterbegin', CARDS.SPRITE);
  renderAll();
  window.__sff = { SC, rerender: () => renderPlay(), state: () => G, net: () => (G ? G.net : null), get lang() { return lang; }, setLang: l => { lang = l; renderAll(); }, startGame, readSetup, view: () => view };
}

})();
