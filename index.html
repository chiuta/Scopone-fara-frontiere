        try { if (s.open) dc.send(JSON.stringify({_fff: 'ping', ts: Date.now()})); } catch (e) { /* ignorat */ }
        const idle = Date.now() - lastSeen;
        if (idle > hb.timeout && state === 'open') { lostSince = Date.now(); set('lost'); emit('lost'); }
        else if (state === 'lost' && Date.now() - lostSince > hb.giveUp) finish('timeout');
      }, hb.interval);
    }
    s._bind = function (ch) {
      dc = ch;
      ch.onopen = () => { clearTimeout(connTimer); set('open'); startHb(); emit('open', s); };
      ch.onmessage = e => {
        if (typeof e.data !== 'string' || e.data.length > MAX_MSG) return;
        let o; try { o = JSON.parse(e.data); } catch (er) { return; }
        if (!o || typeof o !== 'object' || Array.isArray(o)) return;
        lastSeen = Date.now(); received++;
        if (state === 'lost') { set('open'); emit('recovered'); }
        if (o._fff) return internal(o);
        emit('message', o);
      };
      ch.onclose = () => { if (!closed) finish('channel-closed'); };
      ch.onerror = () => { /* detaliile vin prin starea conexiunii */ };
      if (ch.readyState === 'open') ch.onopen();
    };
    s._armConnect = function () {
      clearTimeout(connTimer);
      connTimer = setTimeout(() => { if (!closed && state !== 'open') { emit('error', coded('timeout', 'failed')); finish('timeout'); } }, hb.connect);
    };
    pc.onconnectionstatechange = () => {
      const c = pc.connectionState;
      if (c === 'failed') { emit('error', coded('ice-failed', 'failed')); finish('failed'); }
      else if (c === 'disconnected' && state === 'open') { lostSince = Date.now(); set('lost'); emit('lost'); }
      else if (c === 'connected' && state === 'lost') { set('open'); emit('recovered'); }

  }

  async function prepare(opts) {
    if (!supported()) throw coded('unsupported', 'unsupported');
    return new RTCPeerConnection(rtcConfig(opts));
  }
  async function gather(pc, opts, gp) {
    await gp;
    const sdp = pc.localDescription && pc.localDescription.sdp;
    if (!sdp || !/^a=candidate:/m.test(sdp)) throw coded('no-candidates', 'noCandidates');
    return sdp;
  }

  /** Gazdă: returnează o sesiune cu .offer (cod text); apoi accept(răspuns). */
  async function host(opts) {
    opts = opts || {};
    const pc = await prepare(opts), s = createSession('host', pc, opts);
    try {
      s._bind(pc.createDataChannel('fff', {ordered: true}));
      s._setState('gathering');
      const gp = watchGathering(pc, opts);
      await pc.setLocalDescription(await pc.createOffer());
      s.offer = await encodeSignal('offer', await gather(pc, opts, gp));
    } catch (e) { try { pc.close(); } catch (er) { /* ignorat */ } throw e; }
    s._setState('waiting-answer');
    s.accept = async function (code) {
      const r = await decodeSignal(code);
      if (r.kind !== 'answer') throw coded('wrong-kind', 'wrongKind', {want: T('kindAnswer'), got: T('kindOffer')});
      await pc.setRemoteDescription({type: 'answer', sdp: r.sdp});
      s._setState('connecting'); s._armConnect();
    };
    return s;
  }
  /** Oaspete: primește oferta (cod) și returnează o sesiune cu .answer (cod text). */
  async function join(offerCode, opts) {
    opts = opts || {};
    if (!supported()) throw coded('unsupported', 'unsupported');
    const r = await decodeSignal(offerCode);
    if (r.kind !== 'offer') throw coded('wrong-kind', 'wrongKind', {want: T('kindOffer'), got: T('kindAnswer')});
    const pc = await prepare(opts), s = createSession('guest', pc, opts);
    try {
      s._setState('gathering');
      await pc.setRemoteDescription({type: 'offer', sdp: r.sdp});
      const gp = watchGathering(pc, opts);
      await pc.setLocalDescription(await pc.createAnswer());
      s.answer = await encodeSignal('answer', await gather(pc, opts, gp));
    } catch (e) { try { pc.close(); } catch (er) { /* ignorat */ } throw e; }
    s._setState('connecting'); s._armConnect();
    return s;
  }

  /* ======================= sesiune de joc: lockstep cu gazdă autoritară ======================= */
  function mulberry(seed) {
    let a = seed >>> 0;
    const f = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    f.getState = () => a; f.setState = v => { a = v >>> 0; };
    return f;
  }
  function randSeed() { try { return crypto.getRandomValues(new Uint32Array(1))[0]; } catch (e) { return (Math.random() * 4294967296) >>> 0; } }

  /**
   * lockstep(session, {seed, onMove(move,info), onState(state,info), validate(move,ctx), snapshot(), hash(), onChat(text,from), onError(err), timeout, history})
   * Gazda atribuie seq, validează și difuzează; oaspetele aplică mutările doar în ordinea seq (resincronizare la lipsuri/divergență).
   */
  function lockstep(session, o) {
    o = o || {};
    let sess = session, seq = 0, seed = o.seed != null ? o.seed >>> 0 : randSeed(), rng = mulberry(seed), started = false, stopped = false, cid = 0, helloTries = 0, helloTimer = 0;
    const isHost = () => sess.role === 'host', log = [], ahead = new Map(), pending = new Map(), offs = [];
    const AHEAD_MAX = 256;
    const keep = o.history || 500, stats = {resyncs: 0, rejected: 0, dupes: 0, applied: 0};
    const fail = (reason, extra) => { const e = Object.assign(new Error(reason), {code: reason}, extra || {}); if (o.onError) o.onError(e); return e; };
    const send = m => sess.send(m);
    const tryApply = (move, info) => {
      let r;
      try { r = o.onMove ? o.onMove(move, info) : undefined; } catch (e) { return {ok: false, reason: String(e && e.message || e)}; }
      if (r === false) return {ok: false, reason: 'rejected'};
      if (typeof r === 'string') return {ok: false, reason: r};
      return {ok: true};
    };
    function snapshotMsg() {
      const m = {t: 'sync', seq, seed, rng: rng.getState()};
      if (o.snapshot) m.state = o.snapshot();
      return m;
    }
    function begin(reason, st) {
      if (!started) { started = true; clearTimeout(helloTimer); }
      if (o.onState) o.onState(st, {reason, seq, seed, rng: rng.getState()});
    }
    function applyRemote(m) {                                  // oaspete: o mutare numerotată de la gazdă
      if (m.seq <= seq) { stats.dupes++; return; }
      if (m.seq > seq + 1) {
        if (m.seq - seq > AHEAD_MAX || ahead.size >= AHEAD_MAX) { send({t: 'need', from: seq}); return; }   // plafon: un partener rău nu umple memoria
        ahead.set(m.seq, m); send({t: 'need', from: seq}); return;
      }
      const mine = m.from === 'guest' && pending.has(m.cid);
      const r = tryApply(m.move, {seq: m.seq, from: m.from, mine, rng});
      if (!r.ok) { fail('diverged', {detail: r.reason}); stats.resyncs++; send({t: 'need', from: seq, force: true}); return; }
      seq = m.seq; stats.applied++;
      if (mine) { const p = pending.get(m.cid); pending.delete(m.cid); clearTimeout(p.timer); p.resolve({seq, ok: true}); }
      if (o.hash && m.h != null && String(o.hash()) !== String(m.h)) { stats.resyncs++; send({t: 'need', from: seq, force: true}); return; }
      const nx = ahead.get(seq + 1); if (nx) { ahead.delete(seq + 1); applyRemote(nx); }
    }
    function hostApply(move, from, cidv) {                     // gazdă: validează, aplică, numerotează, difuzează
      if (move == null || typeof move !== 'object') return {ok: false, reason: 'bad-move'};
      if (o.validate) { const v = o.validate(move, {from, seq: seq + 1}); if (v !== true && v !== undefined) return {ok: false, reason: typeof v === 'string' ? v : 'invalid'}; }
      const r = tryApply(move, {seq: seq + 1, from, mine: from === 'host', rng});
      if (!r.ok) return r;
      seq++; stats.applied++;
      log.push({seq, move, from}); if (log.length > keep) log.shift();
      const m = {t: 'move', seq, move, from}; if (cidv != null) m.cid = cidv; if (o.hash) m.h = o.hash();
      send(m);
      return {ok: true, seq};
    }
    function onMsg(m) {
      if (stopped || !m || typeof m.t !== 'string') return;
      if (isHost()) {
        if (m.t === 'hello') { send(snapshotMsg()); }
        else if (m.t === 'move') {
          const r = hostApply(m.move, 'guest', m.cid);
          if (!r.ok) { stats.rejected++; send({t: 'reject', cid: m.cid, reason: r.reason}); }
        } else if (m.t === 'need') {
          const from = Number.isInteger(m.from) ? m.from : -1;
          if (!m.force && log.length && log[0].seq <= from + 1 && from <= seq) send({t: 'moves', list: log.filter(e => e.seq > from)});
          else if (o.snapshot) { stats.resyncs++; send(Object.assign(snapshotMsg(), {resync: true})); }
          else send({t: 'fatal', reason: 'no-history'});
        } else if (m.t === 'chat' && o.onChat && typeof m.text === 'string') o.onChat(m.text.slice(0, 2000), 'guest');
        return;
      }
      if (m.t === 'sync') {                                    // oaspete
        if (!Number.isInteger(m.seq) || !Number.isInteger(m.seed) || m.seq < 0) return;
        if (!m.resync && started && m.seq === seq && m.seed === seed) return;     // idempotent
        if (m.state !== undefined || m.seq === 0) {            // stare completă sau început de joc
          const first = !started;
          seq = m.seq; seed = m.seed >>> 0; rng = mulberry(seed);
          if (Number.isInteger(m.rng)) rng.setState(m.rng);
          ahead.clear(); begin(first ? 'start' : 'resync', m.state);
        } else if (m.seq > seq) {                              // gazda e înainte, fără instantaneu: cere mutările
          if (!started) { seed = m.seed >>> 0; rng = mulberry(seed); started = true; clearTimeout(helloTimer); }
          send({t: 'need', from: seq});
        } else fail('diverged');
      } else if (m.t === 'move') { if (started && Number.isInteger(m.seq) && m.move && typeof m.move === 'object') applyRemote(m); }
      else if (m.t === 'moves' && Array.isArray(m.list)) { m.list.slice(0, keep).forEach(e => { if (e && Number.isInteger(e.seq) && e.move && typeof e.move === 'object') applyRemote({t: 'move', seq: e.seq, move: e.move, from: e.from === 'host' ? 'host' : 'guest'}); }); }
      else if (m.t === 'reject') { const p = pending.get(m.cid); if (p) { pending.delete(m.cid); clearTimeout(p.timer); p.reject(Object.assign(new Error(String(m.reason || 'rejected')), {code: 'rejected'})); } }
      else if (m.t === 'fatal') fail(String(m.reason || 'fatal'));
      else if (m.t === 'chat' && o.onChat && typeof m.text === 'string') o.onChat(m.text.slice(0, 2000), 'host');
    }
    function bind() {
      offs.forEach(f => f()); offs.length = 0;
      offs.push(sess.on('message', onMsg));
      offs.push(sess.on('open', start));
      offs.push(sess.on('close', () => { pending.forEach(p => { clearTimeout(p.timer); p.reject(Object.assign(new Error('closed'), {code: 'closed'})); }); pending.clear(); }));
      if (sess.open) start();
    }
    function start() {
      if (isHost()) { if (!started) { started = true; begin('start'); } send(snapshotMsg()); }
      else { helloTries = 0; hello(); }
    }
    function hello() {
      clearTimeout(helloTimer);
      if (stopped) return;
      if (helloTries++ >= 8) { if (!started) fail('no-sync'); return; }
      send({t: 'hello', seq});
      helloTimer = setTimeout(() => { if (!started) hello(); }, 1500);
    }
    const api = {
      get seq() { return seq; }, get seed() { return seed; }, get role() { return sess.role; }, get stats() { return Object.assign({}, stats); },
      rng: () => rng(), get rngState() { return rng.getState(); },
      /** Trimite o mutare. Gazdă: aplică imediat; oaspete: așteaptă ecoul numerotat al gazdei. Returnează Promise<{seq}>. */
      move(move) {
        if (stopped) return Promise.reject(Object.assign(new Error('stopped'), {code: 'stopped'}));
        if (isHost()) {
          const r = hostApply(move, 'host');
          return r.ok ? Promise.resolve({seq: r.seq, ok: true}) : Promise.reject(Object.assign(new Error(r.reason), {code: 'rejected'}));
        }
        if (!sess.open) return Promise.reject(Object.assign(new Error('closed'), {code: 'closed'}));
        const id = ++cid;
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => { pending.delete(id); reject(Object.assign(new Error('timeout'), {code: 'timeout'})); }, o.timeout || 8000);
          pending.set(id, {resolve, reject, timer});
          if (!send({t: 'move', cid: id, move})) { clearTimeout(timer); pending.delete(id); reject(Object.assign(new Error('closed'), {code: 'closed'})); }
        });
      },
      chat(text) { return send({t: 'chat', text: String(text).slice(0, 2000)}); },
      /** Cere resincronizarea completă (oaspete) sau retrimite starea (gazdă). */
      resync() { if (isHost()) return send(snapshotMsg()); return send({t: 'need', from: seq, force: true}); },
      /** După o reconectare: leagă aceeași stare de joc la o sesiune nouă. */
      rebind(newSession) { sess = newSession; bind(); },
      stop() { stopped = true; clearTimeout(helloTimer); offs.forEach(f => f()); offs.length = 0; }
    };
    bind();
    return api;
  }

<script>
/* ===== MOTOR (funcții pure + stare simplă; testabil în Node) =====
   Cărți: id 0..39. Semn = floor(id/10): 0 Denari, 1 Coppe, 2 Spade, 3 Bastoni.
   Rang = id%10+1: 1=Asso, 2..7, 8=Fante, 9=Cavallo, 10=Re. Valoare de captură = rang. */
const SC = (function () {
'use strict';
const SUITS = ['denari', 'coppe', 'spade', 'bastoni'];
const PRIM = [0, 16, 12, 13, 14, 15, 18, 21, 10, 10, 10]; /* valorile primierei, după rang */
const SETTEBELLO = 6, REBELLO = 9, MATTA = 16; /* 7 denari, Re denari, 7 coppe (matta la Cirulla) */
const suit = id => (id / 10) | 0;
const rank = id => (id % 10) + 1;
const team = p => p % 2;

/* ---------- RNG: crypto (rejection sampling) sau seed (mulberry32) ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0);
  };
}
function hashSeed(s) { /* FNV-1a pe șir -> uint32 */
  s = String(s); let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return h >>> 0;
}
function makeRNG(seed) {
  let u32, seeded = seed !== undefined && seed !== null && seed !== '';
  if (seeded) { u32 = mulberry32(typeof seed === 'number' ? seed >>> 0 : hashSeed(seed)); }
  else {
    const buf = new Uint32Array(64); let k = 64;
    const cr = (typeof globalThis !== 'undefined' && globalThis.crypto) || null;
    if (!cr || !cr.getRandomValues) throw new Error('crypto.getRandomValues indisponibil');
    u32 = function () { if (k >= 64) { cr.getRandomValues(buf); k = 0; } return buf[k++]; };
  }
  function int(n) { /* uniform în [0,n), fără bias modulo */
    if (n <= 1) return 0;
    const lim = Math.floor(4294967296 / n) * n; let r;
    do { r = u32(); } while (r >= lim);
    return r % n;
  }
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = int(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  return { int, u32, shuffle, seeded };
}

/* ---------- Variante (set de reguli) ---------- */
/* cap: 'std' (egal are prioritate, altfel sumă), 'f15a' (doar suma 15), 'f15b' (egal sau 15), 'cir' (Cirulla)
   ace: null | 'apt' (asso piglia tutto, cu scopa) | 'dassi' (scopa d'assi, fără scopa la as) */
const RULESETS = {
  scopa:     { id: 'scopa',     players: 2, per: 3,  table: 4, refill: true,  redealKings: 3, cap: 'std',  ace: null,    targets: [11, 21, 31], target: 11 },
  scopone:   { id: 'scopone',   players: 4, per: 9,  table: 4, refill: false, redealKings: 3, cap: 'std',  ace: null,    targets: [11, 21], target: 11 },
  scopone_s: { id: 'scopone_s', players: 4, per: 10, table: 0, refill: false, redealKings: 0, cap: 'std',  ace: null,    targets: [11, 21], target: 11 },
  scopa15:   { id: 'scopa15',   players: 2, per: 3,  table: 4, refill: true,  redealKings: 3, cap: 'f15a', ace: null,    targets: [11, 21, 31], target: 11 },
  apt:       { id: 'apt',       players: 2, per: 3,  table: 4, refill: true,  redealKings: 3, cap: 'std',  ace: 'apt',   targets: [11, 21, 31], target: 11 },
  dassi:     { id: 'dassi',     players: 4, per: 10, table: 0, refill: false, redealKings: 0, cap: 'std',  ace: 'dassi', targets: [11, 21], target: 11 },
  cirulla:   { id: 'cirulla',   players: 2, per: 3,  table: 4, refill: true,  redealKings: 0, redealAces: 2, cap: 'cir', ace: 'cir', targets: [51, 31, 21], target: 51, cirulla: true }
};
const DEFAULT_OPTS = { target: null, reBello: false, napola: false, lastSweep: false, cap15: 'a' };

function rulesFor(id, opts) {
  const base = RULESETS[id]; if (!base) throw new Error('variantă necunoscută: ' + id);
  const o = Object.assign({}, DEFAULT_OPTS, opts || {});
  const r = Object.assign({}, base);
  if (id === 'scopa15' && o.cap15 === 'b') r.cap = 'f15b';
  r.opts = o; r.winTarget = o.target || base.target;
  return r;
}

/* ---------- Capturi legale ---------- */
/* toate submulțimile de cărți de pe masă cu suma rangurilor = t (dimensiune >= minSize) ; DFS cu tăiere */
function subsetsSum(table, t, minSize) {
  const out = [], n = table.length, cur = [];
  const rk = table.map(rank);
  (function go(i, left) {
    if (left === 0) { if (cur.length >= minSize) out.push(cur.slice()); return; }
    if (left < 0 || i >= n) return;
    for (let j = i; j < n; j++) {
      if (rk[j] > left) continue;
      cur.push(table[j]); go(j + 1, left - rk[j]); cur.pop();
    }
  })(0, t);
  return out;
}
function keyOf(set) { return set.slice().sort((a, b) => a - b).join(','); }
function uniqSets(sets) { const seen = new Set(), out = []; for (const s of sets) { const k = keyOf(s); if (!seen.has(k)) { seen.add(k); out.push(s); } } return out; }

/* returnează lista capturilor posibile (fiecare = listă de id-uri de pe masă); [] => cartea se pune pe masă */
function legalTakes(rules, cardId, table) {
  const v = rank(cardId), cap = rules.cap, ace = rules.ace;
  if (!table.length) return [];
  const eq = table.filter(t => rank(t) === v);
  /* Pagat: „asul ia tot dacă nu e niciun as pe masă; dacă e, ia doar acel as” (la mai mulți ași: alegi unul, ca la Scopa) */
  if ((ace === 'apt' || ace === 'dassi') && v === 1) {
    return eq.length ? eq.map(x => [x]) : [table.slice()];
  }
  switch (cap) {
    case 'std':
      return eq.length ? eq.map(x => [x]) : subsetsSum(table, v, 2);
    case 'f15a':
      return subsetsSum(table, 15 - v, 1);
    case 'f15b': /* Pagat v.2: carte egală SAU set de valoare egală SAU set care cu cartea face 15 */
      return uniqSets(eq.map(x => [x]).concat(subsetsSum(table, v, 2), subsetsSum(table, 15 - v, 1)));
    case 'cir': {
      let res = eq.map(x => [x]).concat(subsetsSum(table, v, 2), subsetsSum(table, 15 - v, 1));
      if (v === 1 && !eq.length) res.push(table.slice());
      return uniqSets(res);
    }
  }
  throw new Error('cap necunoscut');
}
/* referință: enumerare brută 2^n (pentru teste) */
function legalTakesBrute(rules, cardId, table) {
  const v = rank(cardId), n = table.length, cap = rules.cap, ace = rules.ace, all = [];
  if (!n) return [];
  for (let m = 1; m < (1 << n); m++) {
    const s = []; let sum = 0;
    for (let i = 0; i < n; i++) if (m & (1 << i)) { s.push(table[i]); sum += rank(table[i]); }
    all.push({ s, sum });
  }
  const eq = table.filter(t => rank(t) === v);
  if ((ace === 'apt' || ace === 'dassi') && v === 1) return eq.length ? eq.map(x => [x]) : [table.slice()];
  const pick = f => all.filter(f).map(x => x.s);
  switch (cap) {
    case 'std': return eq.length ? eq.map(x => [x]) : pick(x => x.sum === v && x.s.length >= 2);
    case 'f15a': return pick(x => x.sum === 15 - v);
    case 'f15b': return uniqSets(eq.map(x => [x]).concat(pick(x => x.sum === v && x.s.length >= 2), pick(x => x.sum === 15 - v)));

      let res = eq.map(x => [x]).concat(pick(x => x.sum === v && x.s.length >= 2), pick(x => x.sum === 15 - v));
      if (v === 1 && !eq.length) res.push(table.slice());
      return uniqSets(res);
    }
  }
}

/* ---------- Starea unei mâini ---------- */
function cloneState(s) {
  return {
    rules: s.rules, n: s.n, dealer: s.dealer, turn: s.turn,
    hands: s.hands.map(h => h.slice()), table: s.table.slice(), stock: s.stock.slice(),
    piles: [s.piles[0].slice(), s.piles[1].slice()], scope: s.scope.slice(), bonus: s.bonus.slice(),
    lastCap: s.lastCap, over: s.over, history: null, plays: s.plays, round: s.round, scopaCards: s.scopaCards ? s.scopaCards.slice() : null
  };
}

function cirullaHandBonus(cards) { /* 3 cărți: barsega (suma<=9) = 3, barsegon (trei egale) = 10; matta (7 coppe) e joker doar pentru bonus */
  if (cards.length !== 3) return 0;
  const hasM = cards.indexOf(MATTA) >= 0;
  const rk = cards.map(rank);
  const nm = cards.filter(c => c !== MATTA).map(rank); /* fără matta */
  /* trei egale */
  if (rk[0] === rk[1] && rk[1] === rk[2]) return 10;
  if (hasM && nm.length === 2 && nm[0] === nm[1]) return 10;
  /* suma <= 9 (matta numără 1 dacă e util) */
  let sum = 0; for (const c of cards) sum += (c === MATTA ? 1 : rank(c));
  if (sum <= 9) return 3;
  return 0;
}

/* împarte o mână. rng: obiect makeRNG. dealer: indice. */
function dealHand(rules, dealer, rng) {
  const n = rules.players;
  for (let tries = 0; tries < 1000; tries++) {
    const deck = rng.shuffle(Array.from({ length: 40 }, (_, i) => i));
    const hands = [];
    let pos = 0;
    const order = []; for (let i = 1; i <= n; i++) order.push((dealer + i) % n);
    for (let i = 0; i < n; i++) hands.push([]);
    for (const p of order) { hands[p] = deck.slice(pos, pos + rules.per); pos += rules.per; }
    const table = deck.slice(pos, pos + rules.table); pos += rules.table;
    const stock = deck.slice(pos);
    if (rules.redealKings && table.filter(c => rank(c) === 10).length >= rules.redealKings) continue;
    if (rules.redealAces && table.filter(c => rank(c) === 1).length >= rules.redealAces) continue;
    return { hands, table, stock, redeals: tries };
  }
  throw new Error('prea multe re-împărțiri');
}

function newHand(rules, dealer, rng) {
  const d = dealHand(rules, dealer, rng);
  const st = {
    rules, n: rules.players, dealer, turn: (dealer + 1) % rules.players,
    hands: d.hands, table: d.table, stock: d.stock,
    piles: [[], []], scope: [0, 0], bonus: [0, 0], lastCap: -1, over: false,
    history: [], plays: 0, round: 1, scopaCards: [], events: [], redeals: d.redeals
  };
  /* Cirulla: bonus de dealer (masa = 15 sau 30) și bonusuri de mână */
  if (rules.cirulla) {
    const sum = st.table.reduce((a, c) => a + rank(c), 0);
    if (sum === 15 || sum === 30) {
      const t = team(dealer);
      st.piles[t].push(...st.table); st.table = [];
      st.scope[t] += sum === 15 ? 1 : 2; st.lastCap = t;
      st.events.push({ type: 'dealerBonus', p: dealer, pts: sum === 15 ? 1 : 2 });
    }
    applyHandBonuses(st);
  }
  return st;
}

  if (!st.rules.cirulla) return;
  for (let p = 0; p < st.n; p++) {
    const b = cirullaHandBonus(st.hands[p]);
    if (b) { st.bonus[team(p)] += b; if (st.events) st.events.push({ type: 'handBonus', p, pts: b, cards: st.hands[p].slice() }); }
  }
}

function isLastPlay(st) { return st.stock.length === 0 && st.hands.every(h => h.length === 0); }

/* mutări legale pentru jucătorul la rând: [{card, take:[...]}] */
function legalMoves(st, p) {
  if (p === undefined) p = st.turn;
  const out = [];
  for (const c of st.hands[p]) {
    const takes = legalTakes(st.rules, c, st.table);
    if (!takes.length) out.push({ card: c, take: [] });
    else for (const t of takes) out.push({ card: c, take: t });
  }
  return out;
}
function sameSet(a, b) { return a.length === b.length && keyOf(a) === keyOf(b); }

/* aplică o mutare (mută pe loc starea). check=true => aruncă dacă e ilegală */
function applyMove(st, mv, check) {
  if (st.over) throw new Error('mâna s-a terminat');
  const p = st.turn, h = st.hands[p];
  const ci = h.indexOf(mv.card);
  if (ci < 0) throw new Error('cartea nu e în mână');
  if (check) {
    const takes = legalTakes(st.rules, mv.card, st.table);
    if (!takes.length) { if (mv.take.length) throw new Error('captură ilegală (nu există captură)'); }
    else if (!takes.some(t => sameSet(t, mv.take))) throw new Error('captură ilegală');
  }
  h.splice(ci, 1);
  const t = team(p); let sweep = false;
  if (!mv.take.length) {
    st.table.push(mv.card);
  } else {
    const rem = new Set(mv.take);
    const before = st.table.length;
    st.table = st.table.filter(c => !rem.has(c));
    if (before - st.table.length !== mv.take.length) throw new Error('captură cu cărți absente de pe masă');
    st.piles[t].push(mv.card, ...mv.take);
    st.lastCap = t;
    if (st.table.length === 0) {
      const last = isLastPlay(st);
      const aceNoScopa = st.rules.ace === 'dassi' && rank(mv.card) === 1;
      if (!aceNoScopa && (!last || st.rules.opts.lastSweep)) { st.scope[t]++; sweep = true; if (st.scopaCards) st.scopaCards.push(mv.card); }
    }
  }
  st.plays++;
  if (st.history) st.history.push({ p, card: mv.card, take: mv.take.slice(), sweep });
  /* avansare */
  st.turn = (p + 1) % st.n;
  if (st.hands.every(x => x.length === 0)) {
    if (st.stock.length) {
      const per = st.rules.per;
      for (let i = 1; i <= st.n; i++) { const q = (st.dealer + i) % st.n; st.hands[q] = st.stock.splice(0, per); }
      st.round++;
      st.turn = (st.dealer + 1) % st.n;
      if (st.rules.cirulla) applyHandBonuses(st);
    } else {
      if (st.table.length && st.lastCap >= 0) { st.piles[st.lastCap].push(...st.table); st.table = []; st.leftoverTo = st.lastCap; }
      st.over = true;
    }
  }
  return { sweep };
}

/* ---------- Scorare ---------- */
function primieraOf(pile) { /* null dacă lipsește vreun semn */
  const best = [0, 0, 0, 0];
  for (const c of pile) { const v = PRIM[rank(c)]; if (v > best[suit(c)]) best[suit(c)] = v; }
  if (best.some(x => x === 0)) return null;
  return best[0] + best[1] + best[2] + best[3];
}
function napolaLen(pile) { /* lungimea secvenței A,2,3,... de denari */
  const has = new Set(pile.filter(c => suit(c) === 0).map(rank));
  let k = 0; while (k < 10 && has.has(k + 1)) k++;
  return k;
}
function compareMaj(a, b) { return a > b ? [1, 0] : b > a ? [0, 1] : [0, 0]; }

/* st: starea (piles complete). Returnează {teams:[{...}], total:[a,b], instant: null|team} */
function scoreHand(st) {
  const rules = st.rules, o = rules.opts, P = st.piles;
  const T = [{}, {}];
  const cards = [P[0].length, P[1].length];
  const den = [0, 1].map(i => P[i].filter(c => suit(c) === 0).length);
  const cm = compareMaj(cards[0], cards[1]), dm = compareMaj(den[0], den[1]);
  const pr = [primieraOf(P[0]), primieraOf(P[1])];
  let pm = [0, 0];
  if (pr[0] !== null && pr[1] !== null) pm = compareMaj(pr[0], pr[1]);
  else if (pr[0] !== null) pm = [1, 0]; else if (pr[1] !== null) pm = [0, 1];
  let instant = null;
  for (let i = 0; i < 2; i++) {
    const t = T[i];
    t.scope = st.scope[i] + (st.bonus[i] || 0); t.scopeOnly = st.scope[i]; t.handBonus = st.bonus[i] || 0;
    t.carte = cm[i]; t.denari = dm[i]; t.sette = P[i].indexOf(SETTEBELLO) >= 0 ? 1 : 0; t.prim = pm[i];
    t.cards = cards[i]; t.den = den[i]; t.primVal = pr[i];
    t.reBello = (o.reBello && P[i].indexOf(REBELLO) >= 0) ? 1 : 0;
    const nl = napolaLen(P[i]);
    t.napola = 0;
    if (rules.cirulla) {
      /* piccola: >=3 denari consecutivi de la Asso, 1 pct/carte (maxim 6); grande: Re+Cavallo+Fante de denari = 5 */
      t.piccola = nl >= 3 ? Math.min(nl, 6) : 0;
      t.grande = (P[i].indexOf(9) >= 0 && P[i].indexOf(8) >= 0 && P[i].indexOf(7) >= 0) ? 5 : 0;
      /* NOTĂ: în Cirulla (Pagat) Re=10, Cavallo=9, Fante=8: id denari rang 10=9, rang 9=8, rang 8=7 */
      if (den[i] === 10) instant = i; /* cappotto */
    } else {
      t.piccola = 0; t.grande = 0;
      if (o.napola) { t.napola = nl >= 3 ? nl : 0; if (nl === 10) instant = i; }
    }
    t.total = t.scope + t.carte + t.denari + t.sette + t.prim + t.reBello + t.napola + t.piccola + t.grande;
  }
  return { teams: T, total: [T[0].total, T[1].total], instant };
}

/* ---------- Meci ---------- */
function newMatch(id, opts, rng) {
  const rules = rulesFor(id, opts);
  return { rules, scores: [0, 0], dealer: rng.int(rules.players), hands: 0, winner: -1, rounds: [] };
}
function startHand(match, rng) { match.hands++; return newHand(match.rules, match.dealer, rng); }
function finishHand(match, st) {
  const sc = scoreHand(st);
  match.scores[0] += sc.total[0]; match.scores[1] += sc.total[1];
  match.rounds.push({ score: sc, dealer: match.dealer });
  match.dealer = (match.dealer + 1) % match.rules.players;
  let w = -1;
  if (sc.instant !== null) w = sc.instant;
  else if (match.scores[0] >= match.rules.winTarget || match.scores[1] >= match.rules.winTarget) {
    if (match.scores[0] > match.scores[1]) w = 0; else if (match.scores[1] > match.scores[0]) w = 1;
  }
  match.winner = w;
  return sc;
}

/* ---------- Observație (ce are voie să vadă un jucător) ---------- */
function observe(st, p) {
  return {
    rules: st.rules, n: st.n, me: p, dealer: st.dealer, turn: st.turn,
    hand: st.hands[p].slice(), table: st.table.slice(),
    handSizes: st.hands.map(h => h.length), stockSize: st.stock.length,
    piles: [st.piles[0].slice(), st.piles[1].slice()], scope: st.scope.slice(), bonus: st.bonus.slice(),
    lastCap: st.lastCap, round: st.round
  };
}
function unseenOf(obs) {
  const known = new Set(obs.hand); for (const c of obs.table) known.add(c);
  for (const pl of obs.piles) for (const c of pl) known.add(c);
  const u = []; for (let i = 0; i < 40; i++) if (!known.has(i)) u.push(i);
  return u;
}
function determinize(obs, rng) {
  const u = rng.shuffle(unseenOf(obs));
  const hands = []; let pos = 0;
  for (let q = 0; q < obs.n; q++) {
    if (q === obs.me) { hands.push(obs.hand.slice()); continue; }
    hands.push(u.slice(pos, pos + obs.handSizes[q])); pos += obs.handSizes[q];
  }
  const stock = u.slice(pos, pos + obs.stockSize);
  if (pos + obs.stockSize !== u.length) throw new Error('determinize: carduri nevăzute inconsistente');
  return {
    rules: obs.rules, n: obs.n, dealer: obs.dealer, turn: obs.turn, hands, table: obs.table.slice(), stock,
    piles: [obs.piles[0].slice(), obs.piles[1].slice()], scope: obs.scope.slice(), bonus: obs.bonus.slice(),
    lastCap: obs.lastCap, over: false, history: null, plays: 0, round: obs.round, scopaCards: null
  };
}

/* ---------- AI ---------- */
const PW = [0, 0.8, 0.3, 0.4, 0.5, 0.7, 1.1, 1.7, 0, 0, 0];
function cardUtil(c, o) {
  let u = 0.35 + PW[rank(c)];
  if (suit(c) === 0) u += 0.85;
  if (c === SETTEBELLO) u += 7;
  if (o && o.reBello && c === REBELLO) u += 7;
  return u;
}
const SCOPA_U = 7;
function gainOf(rules, mv, tableAfterEmpty, last) {
  let g = cardUtil(mv.card, rules.opts);
  for (const c of mv.take) g += cardUtil(c, rules.opts);
  if (mv.take.length && tableAfterEmpty && (!last || rules.opts.lastSweep) && !(rules.ace === 'dassi' && rank(mv.card) === 1)) g += SCOPA_U;
  return g;
}
/* politică ieftină pentru rollout-uri */
function cheapPick(st, rng) {
  const p = st.turn, rules = st.rules, o = rules.opts, hand = st.hands[p];
  let best = null, bestV = -1e9;
  const last = st.stock.length === 0 && st.hands.reduce((a, h) => a + h.length, 0) === 1;
  for (let i = 0; i < hand.length; i++) {
    const c = hand[i];
    const takes = legalTakes(rules, c, st.table);
    if (!takes.length) {
      const v = -cardUtil(c, o) * 0.5 + rng.int(100) * 0.0004;
      if (v > bestV) { bestV = v; best = { card: c, take: [] }; }
    } else {
      for (const t of takes) {
        const mv = { card: c, take: t };
        let v = gainOf(rules, mv, t.length === st.table.length, last);
        let rest = 0; /* expunere: ce rămâne pe masă */
        if (t.length < st.table.length) { const rs = new Set(t); for (const x of st.table) if (!rs.has(x)) rest += cardUtil(x, o); }
        v -= rest * 0.2; v += rng.int(100) * 0.0004;
        if (v > bestV) { bestV = v; best = mv; }
      }
    }
  }
  return best;

/* distribuția cărților nevăzute pe rang, pentru estimarea riscului de scopa */
function sweepProb(rules, tableAfter, obs, unseen) {
  if (!tableAfter.length) return 0;
  const U = unseen.length; if (!U) return 0;
  const byRank = new Array(11).fill(0); for (const c of unseen) byRank[rank(c)]++;
  let k = 0;
  for (let r = 1; r <= 10; r++) {
    if (!byRank[r]) continue;
    /* o carte reprezentativă a rangului r (semn 1) */
    const rep = 10 * 1 + (r - 1);
    const takes = legalTakes(rules, rep, tableAfter);
    if (takes.some(t => t.length === tableAfter.length)) k += byRank[r];
  }
  if (!k) return 0;
  const h = Math.max(1, Math.min(obs.handSizes[(obs.me + 1) % obs.n], U));

/* euristică 1-ply cu estimarea riscului (nivel „Euristic") */
function scoreMovesHeuristic(obs, moves, unseen) {
  const rules = obs.rules, o = rules.opts;
  const last = obs.stockSize === 0 && obs.handSizes.reduce((a, b) => a + b, 0) === 1;
  const res = [];

    const rs = new Set(mv.take);
    const rest = obs.table.filter(c => !rs.has(c));
    if (!mv.take.length) rest.push(mv.card);
    let v = mv.take.length ? gainOf(rules, mv, rest.length === 0, last) : 0;
    let exp = 0; for (const x of rest) exp += cardUtil(x, o);

  const out = [];
  for (const c of obs.hand) {
    const takes = legalTakes(obs.rules, c, obs.table);
    if (!takes.length) out.push({ card: c, take: [] }); else for (const t of takes) out.push({ card: c, take: t });
  }
  return out;

/* alegerea mutării. level: 'h' (euristic) | 'mc' (determinizări + rollout). obs conține DOAR ce vede jucătorul. */
function chooseMove(obs, level, rng, samples) {
  const moves = obsMoves(obs);
  if (moves.length === 1) return moves[0];
  const unseen = unseenOf(obs);
  const hv = scoreMovesHeuristic(obs, moves, unseen);
  if (level !== 'mc') {
    let bi = 0, bv = -1e9;
    for (let i = 0; i < moves.length; i++) { const v = hv[i] + rng.int(1000) * 1e-6; if (v > bv) { bv = v; bi = i; } }
    return moves[bi];

  const S = Math.max(8, Math.min(samples || 40, Math.floor(10000 / (moves.length * Math.max(1, remaining) * (1 + obs.table.length / 5))))), me = team(obs.me);

    const base = determinize(obs, rng);
    const seed = rng.u32();
    for (let i = 0; i < moves.length; i++) {
      const st = cloneState(base); st.rules = obs.rules;
      const r2 = makeRNG(seed + i * 0 + 1);
      applyMove(st, moves[i], false);
      let guard = 0;
      while (!st.over && guard++ < 100) applyMove(st, cheapPick(st, r2), false);
      const sc = scoreHand(st);
      tot[i] += (sc.total[me] - sc.total[1 - me]) + (sc.instant !== null ? (sc.instant === me ? 30 : -30) : 0);
    }

  for (let i = 0; i < moves.length; i++) {
    const v = tot[i] / S + hv[i] * 0.02; /* euristica ca departajare */
    if (v > bv) { bv = v; bi = i; }
  }
  return moves[bi];

/* ---------- Joc complet AI vs AI (pentru teste) ---------- */
function playHandAI(st, levels, rng, onMove) {
  let guard = 0;
  while (!st.over) {
    if (guard++ > 100) throw new Error('mâna nu se termină');
    const p = st.turn;
    const obs = observe(st, p);
    const mv = chooseMove(obs, levels[p], rng, levels.samples);
    applyMove(st, mv, true);
    if (onMove) onMove(st, p, mv);
  }
  return st;
}

/* ---------- Rubamazzo (⚠ reguli regionale; 2 jucători) ---------- */
const RUBA = {
  deal(rng, dealer) {
    const deck = rng.shuffle(Array.from({ length: 40 }, (_, i) => i));
    const first = 1 - dealer;
    const hands = [[], []]; hands[first] = deck.slice(0, 3); hands[dealer] = deck.slice(3, 6);
    return { dealer, turn: first, hands, table: deck.slice(6, 10), stock: deck.slice(10), piles: [[], []], lastCap: -1, over: false, round: 1, plays: 0 };
  },
  moves(st, p) {
    p = p === undefined ? st.turn : p;
    const out = [], opp = st.piles[1 - p], top = opp.length ? opp[opp.length - 1] : -1;

      if (top >= 0 && rank(top) === rank(c)) { out.push({ card: c, kind: 'steal' }); any = true; }

    }

  observe(st, p) { return { me: p, hand: st.hands[p].slice(), table: st.table.slice(), piles: [st.piles[0].slice(), st.piles[1].slice()], opHand: st.hands[1 - p].length, stock: st.stock.length, turn: st.turn }; },

const ATLAS_L10N = {"fr":{"scopa":{"name":"Scopa","origin":"Italie (dans tout le pays ; le jeu de cartes italien le plus répandu). Se joue avec le jeu italien de 40 cartes (deniers, coupes, épées, bâtons).","deal":"Le donneur distribue 3 cartes à chaque joueur et place 4 cartes face visible sur la table ; le reste forme la pioche. Quand les 3 cartes ont été jouées, on en redistribue 3 à chacun, sans rien ajouter à la table, jusqu’à épuisement de la pioche (à deux joueurs : 6 tours). Si 3 ou 4 rois se trouvent sur la table, on mélange et on redonne.","rules":["Valeurs de prise : As 1, 2–7 valeur faciale, Fante (valet) 8, Cavallo (cheval/dame) 9, Re (roi) 10.","Un tour consiste à jouer une carte. Une carte égale à une carte de la table la prend (s’il y en a plusieurs, vous choisissez). Ce n’est que s’il n’existe aucune carte égale que vous pouvez prendre un ensemble de cartes de la table dont la somme égale votre carte (priorité à la carte égale). Sinon, la carte reste sur la table.","La prise est obligatoire quand elle est possible ; le choix de la carte à jouer est libre.","Prendre toutes les cartes de la table est une scopa (balayage, 1 point). Une prise faite avec la toute dernière carte de la main n’est jamais une scopa. À la fin, les cartes restant sur la table vont au dernier joueur qui a pris.","Décompte de la main : scope ; Carte (le plus de cartes) ; Denari (le plus de deniers) ; Settebello (7 de deniers) ; Primiera (meilleure primiera : une carte par couleur, valeurs 7=21, 6=18, As=16, 5=15, 4=14, 3=13, 2=12, figures=10 ; un camp auquel manque une couleur ne peut pas la marquer). Une égalité ne rapporte rien.","On joue en 11 points (21 ou 31 par convention) ; si les deux dépassent l’objectif dans la même main, le score le plus élevé l’emporte ; en cas d’égalité, on rejoue une main.","À deux joueurs, l’adversaire du donneur joue en premier et la donne alterne à chaque main."],"regional":["Le nord-est utilise des cartes à enseignes françaises avec Roi, Dame, Valet.","Échelles régionales de la primiera : certaines régions comptent 2–7 à leur valeur faciale, l’As 5½ et les figures ½.","En option : Re bello (roi de deniers +1) et Napola (A-2-3… de deniers) — disponibles comme options.","« Chiamarsi fuori » (annoncer l’objectif avant la fin de la main) n’est pas implémenté."],"approx":[]},"scopone":{"name":"Scopone 9+4 (Wikipédia : « scientifico »)","origin":"Italie. La version à quatre joueurs en équipes (les partenaires sont face à face), avec 4 cartes sur la table au départ.","deal":"Chaque joueur reçoit 9 cartes et 4 cartes sont posées face visible sur la table (36 + 4 = 40). Avec 3 ou 4 rois sur la table, on mélange et on redonne. Le joueur à la droite du donneur entame ; le jeu tourne dans le sens inverse des aiguilles d’une montre.","rules":["Les prises, les scope, la règle de la dernière main et le décompte sont comme à la Scopa ; les cartes gagnées vont dans la pile commune de l’équipe.","Une scopa faite avec la dernière carte de la main ne compte pas (une option permet de l’activer).","Objectif : 11 points (21 en option) ; si les deux camps le dépassent dans la même main, le score le plus élevé l’emporte ; en cas d’égalité, on joue d’autres mains."],"regional":["⚠ NOM CONTESTÉ : Pagat et un guide italien (Aranzulla) appellent le 9+4 « Scopone » et le jeu à 10 cartes avec table vide « Scopone scientifico » ; les Wikipédia italien et anglais l’attribuent à l’inverse (scientifico = 9 cartes + 4 sur la table ; le jeu à 10 cartes est « Scopone a 10 carte »). Les règles jouées sont les mêmes quel que soit le nom ; le règlement de la fédération n’a pas pu être consulté. La variante est donc désignée ici par le nombre de cartes.","Objectif de 21 dans certaines sources (Wikipédia italien) ; 11 chez Pagat (valeur par défaut ici, 21 en option)."],"approx":["⚠ Les règles suivent les sources ; seul le NOM (Scopone / Scopone scientifico) diffère selon les sources — voir « Différences régionales »."]},"scopone_s":{"name":"Scopone à 10 cartes, table vide (Pagat : « scientifico »)","origin":"Italie. Le membre « intellectuel » de la famille : les 40 cartes sont toutes distribuées (10 chacun), la table est vide au départ, et un joueur attentif peut compter les cartes (toutes les cartes jouées sont, en principe, visibles en mémoire).","deal":"Chaque joueur reçoit 10 cartes ; la table est vide au départ. Le joueur à la droite du donneur entame ; sens inverse des aiguilles d’une montre. Les partenaires sont face à face (places 0–2 contre 1–3).","rules":["Prises comme à la Scopa (la carte égale a la priorité, sinon une somme) ; la prise est obligatoire quand elle est possible.","Une scopa (table nettoyée) vaut 1 point, mais PAS avec la dernière carte de la main. Certains joueurs attribuent tout de même une scopa au camp du donneur sur la dernière carte (option : « La scopa compte aussi à la dernière carte »).","Décompte de la main : scope plus jusqu’à 4 points (Carte, Denari, Settebello, Primiera). Il n’y a pas de total constant par main : le score d’une main dépend des scope. L’objectif de la partie (11 ou 21) est ce qu’on appelle parfois « 11 points ».","Options : Re bello (+1), Napola (A-2-3… de deniers, valeur = longueur de la suite), Napoleone (les 10 deniers gagnent).","Pendant le jeu, les 40 cartes finissent dans les piles des équipes ; à la fin, les 40 sont dans les piles."],"regional":["⚠ NOM CONTESTÉ : Pagat et Aranzulla appellent cette variante (10 cartes, table vide) « Scopone scientifico » ; les Wikipédia italien et anglais l’appellent « Scopone a 10 carte » et réservent « scientifico » au 9+4. Les règles sont les mêmes. « 9 cartes et une table vide » est impossible (4×9=36).","Une scopa sur la dernière carte du donneur est contestée (Pagat : « certains estiment que l’équipe du donneur marque ») ; par défaut elle ne compte pas.","Une Federazione Italiana Scopone existe (federazionescopone.it) ; son règlement n’a pas pu être consulté pour ce projet — Pagat est utilisé. L’objectif officiel (11 ou 21) varie selon les sources."],"approx":["⚠ Les règles suivent les sources ; seul le NOM diffère selon les sources — voir « Différences régionales »."]},"scopa15":{"name":"Scopa a 15 (Scopa di quindici)","origin":"Italie. Une Scopa où la somme visée est 15 plutôt que la valeur de la carte jouée. Pagat décrit trois versions ; les deux premières sont implémentées.","deal":"Comme à la Scopa : 3 cartes chacun, 4 sur la table, redistributions de 3, nouvelle donne si 3–4 rois.","rules":["Version a (par défaut) : vous ne pouvez prendre QUE des cartes de la table qui, avec la carte jouée, font exactement 15. Une carte ne peut pas prendre seule une carte égale (par ex. un 5 peut prendre un 10).","Version b : la carte jouée peut prendre soit une carte égale, soit un ensemble de même valeur totale, soit un ensemble qui fait 15 avec elle (pas de priorité fixe : vous choisissez).","La prise est obligatoire quand elle est possible ; scopa, dernière carte, décompte et objectif comme à la Scopa (11/21/31)."],"regional":["La version 3 de Pagat (la deuxième plus l’As qui prend tout comme scopa, généralement jusqu’à 31) n’existe que dans l’atlas.","Certains jouent une règle « le moins de cartes » (dans la version 2) — non implémentée.","Apparenté à l’escoba espagnole et à des jeux semblables ; non vérifié ici."],"approx":["La version 3 et la règle « le moins de cartes » manquent (atlas seulement)."]},"apt":{"name":"Asso piglia tutto (l’As prend tout)","origin":"Italie. Une Scopa où l’As a des pouvoirs spéciaux.","deal":"Comme à la Scopa (3+4, redistributions de 3, nouvelle donne si 3–4 rois).","rules":["Un As joué sur une table sans autre As prend toutes les cartes de la table et marque une scopa. Si un As est déjà sur la table, l’As joué ne prend que cet As (s’il y a plusieurs As, vous en choisissez un). Sur une table vide, l’As reste là.","Les autres cartes se jouent comme à la Scopa. Décompte comme à la Scopa."],"regional":["Pagat décrit brièvement la règle ; le cas de plusieurs As sur la table n’est pas précisé ; la règle ordinaire de la Scopa est appliquée ici (vous choisissez un As égal).","Le Wikipédia italien ajoute une règle facultative « del vile » (le premier joueur ne peut pas jouer un As sur une table vide) — non implémentée."],"approx":["⚠ La description de Pagat est courte ; quand plusieurs As sont sur la table, l’As joué n’en prend qu’un, au choix (interprétation ; Pagat est muet)."]},"dassi":{"name":"Scopa d’assi","origin":"Italie. Comme Asso piglia tutto, mais l’As qui prend tout ne marque pas de scopa ; souvent joué à quatre en équipes avec 9–10 cartes.","deal":"Implémenté : 4 joueurs en équipes, 10 cartes chacun, table vide, pas de condition de nouvelle donne (Wikipédia italien). Le joueur à la droite du donneur entame.","rules":["Un As joué sur une table sans As prend toutes les cartes de la table et ne marque PAS de scopa ; si un As est sur la table, l’As joué ne prend que cet As (comme à l’Asso piglia tutto). Sur une table vide, l’As reste là.","Autres cartes : comme à la Scopa (la carte égale a la priorité, sinon une somme) ; une scopa faite avec une carte autre qu’un As compte.","Décompte : Carte, Denari, Settebello, Primiera (+ scope), objectif 11/21."],"regional":["Variantes de Pagat : un As joué sur une table vide se prend lui-même ; nouvelle donne si un As apparaît dans la disposition initiale. Non implémenté.","Pagat définit la Scopa d’assi comme l’Asso piglia tutto sans point de scopa pour l’As qui prend tout ; le même traitement de l’As s’applique quand un As est déjà sur la table."],"approx":["⚠ Les sources diffèrent sur des détails (As sur une table vide, scope faites avec une carte autre qu’un As, 9 ou 10 cartes) ; ici : 10 cartes, un As prend tout (quand aucun As n’est sur la table) sans scopa, les scope faites avec d’autres cartes comptent, l’As sur une table vide reste."]},"cirulla":{"name":"Cirulla","origin":"Ligurie (Gênes) et Bas-Piémont. Traditionnellement joué avec des cartes génoises à enseignes françaises ; ici avec n’importe quel jeu de 40 cartes.","deal":"3 cartes chacun et 4 sur la table ; nouvelle donne s’il y a 2 As ou plus sur la table. Si les 4 cartes de la table totalisent exactement 15 (1 scopa) ou 30 (2 scope), le donneur les prend aussitôt.","rules":["Prises (à votre choix) : une carte égale ; un ensemble de même somme ; des cartes qui avec la carte jouée font 15 ; un As prend toute la table s’il n’y a pas d’As dessus. Scopa = table nettoyée (1 point) ; à la fin, le reste de la table va au dernier preneur sans scopa.","Bonus de main : trois cartes totalisant ≤ 9 = 3 scope (« barsega ») ; trois cartes égales = 10 scope (« barsegon ») ; le 7 de coupes (cœurs) est un joker (matta) pour le bonus seulement.","Décompte : scope, Carte, Denari, Settebello, Primiera, La piccola (A-2-3… de deniers, 1 point par carte, minimum 3, au plus 6), La grande (Roi+Cheval+Valet de deniers = 5). Tous les 10 deniers = « cappotto » : victoire immédiate.","Objectif : 51 (ou bien 31/21) ; la main est de toute façon terminée."],"regional":["Pagat note plusieurs moments permis pour annoncer les bonus (frapper : au début du tour, entre la donne et la première carte, juste après la donne).","Cirullone (Ligurie) et Cicera (Brescia) sont des jeux apparentés/distincts — simplement mentionnés.","La variante de tournoi (cappotto aussi pour quatre cartes de même rang sur la table) manque."],"approx":["⚠ Les bonus de main sont annoncés automatiquement au début de chaque distribution de 3 cartes (pas de frappe, de bluff ni de rétractation), pour les deux joueurs ; la matta est choisie automatiquement pour le meilleur résultat.","⚠ « La piccola » plafonnée à 6 et « La grande » = 5 selon le résumé de Pagat ; les valeurs exactes n’ont pas été confirmées par une seconde source.","⚠ La prise est obligatoire pour la carte jouée si elle peut prendre (Pagat est moins explicite)."]},"rubamazzo":{"name":"Rubamazzo (Rubamazzetto)","origin":"Italie. Un jeu simplifié proche de la Scopa dans lequel on peut voler la pile de l’adversaire.","deal":"3 cartes chacun, 4 sur la table, redistributions de 3 jusqu’à épuisement de la pioche. L’adversaire du donneur entame.","rules":["Jouez une carte. Si elle a le même rang qu’une carte de la table, vous la prenez (en posant votre carte sur votre pile). Si elle a le même rang que la carte du dessus de la pile de l’adversaire (la dernière prise, toujours visible), vous pouvez voler toute la pile. Si les deux sont possibles, vous choisissez.","Prendre ou voler est obligatoire quand c’est possible ; sinon, la carte reste sur la table.","À la fin, le reste de la table va au dernier preneur ; le joueur qui a le plus de cartes gagne (20–20 = nul)."],"regional":["Les règles locales varient beaucoup (l’As voleur ; qui peut voler dans sa propre pile ; règles de la dernière main).","Les sources consultées (Wikipédia italien, un guide italien) ne décrivent aucune protection supplémentaire de la pile ni de points spéciaux."],"approx":["⚠ Les règles régionales varient ; le noyau commun de deux sources est implémenté. Pas de variante avec l’As, pas de points supplémentaires. IA simple (heuristique, pas Monte-Carlo)."]},"bazzica":{"name":"Scopa Bazzica","origin":"Italie (deux joueurs).","deal":"","rules":["Juste après la distribution de 3 cartes, des combinaisons peuvent être annoncées : Bazzica (trois cartes totalisant ≤ 9, figures 10) = 3 points ; Bazzicotto (trois cartes de même rang) = 10 points. Seule la meilleure marque ; pour la bazzica, le total le plus bas l’emporte, pour le bazzicotto, le rang le plus bas. Parties à 21 ou 31."],"regional":[],"approx":[]},"scalette":{"name":"Scopa avec scalette / Napola","origin":"Italie.","deal":"","rules":["Suites de deniers : petite échelle (A-2-3, 3 points, prolongée jusqu’au Cheval = 9) et grande échelle (Roi-Cheval-Valet, 5 points, prolongée vers le bas jusqu’au 2 = 11). Tous les deniers = « Scala » : victoire. Napola : A-2-3… de deniers, un point par carte."],"regional":["Napola et Re bello sont des options de la Scopa/Scopone ; les scalette n’existent que dans l’atlas."],"approx":[]},"sbarazzina":{"name":"Sbarazzina et Piva","origin":"Émilie (Italie).","deal":"","rules":["Sbarazzina : l’As prend tout sans scopa ; le Re bello est un point ; bazzica 2 points (tous rangs différents) ou 3 (avec une paire) ; brelan = 7 ; partie à 41. Piva : variante à deux joueurs avec des cartes piacentines dans laquelle prendre le 2 de bâtons vaut −5 points ; parties à 21 ou 31, les scores peuvent devenir négatifs."],"regional":[],"approx":[]},"corsa":{"name":"Scopa corse","origin":"Corse.","deal":"","rules":["Jeu de 36 cartes (sans les 2). Deux joueurs : donnes de 3,3,3,3,4,4 ; quatre joueurs en équipes fixes. La prise n’est pas obligatoire. Parties à 21 (ou 16/11)."],"regional":[],"approx":[]},"chkobba":{"name":"Chkobba","origin":"Tunisie ; populaire aussi en France.","deal":"","rules":["Jeu français de 40 cartes (sans 8, 9, 10 ; Valet 9, Dame 8). La carte du dessus après la coupe peut être gardée ou posée sur la table. Prise obligatoire ; chkobba = table nettoyée, pas sur la dernière carte du donneur. Décompte : kārṭa (le plus de cartes), dīnārī (carreaux), barmīla (le plus de sept, puis de six), sabʿa l-ḥayya (7 de carreau), plus la chkobba. Objectif 21 (ou 11/31)."],"regional":[],"approx":[]},"hurrikan":{"name":"Hurrikan","origin":"Allemagne, années 1930.","deal":"","rules":["Trois sous-donnes de six cartes ; les cœurs sont la couleur bonus (7 de cœur = 1 point, six cœurs ou plus = 1 point). Objectif 16 ; partie double si le perdant a moins de 8."],"regional":[],"approx":[]},"cicera":{"name":"Cicera, Cirullone","origin":"Brescia (Cicera), Ligurie (Cirullone).","deal":"","rules":["Jeux proches de la Cirulla/Scopone, avec des pages distinctes chez Pagat ; leurs règles complètes n’ont pas pu être lues ici, elles ne sont donc ni décrites ni implémentées."],"regional":[],"approx":[]}},"it":{"scopa":{"name":"Scopa","origin":"Italia (in tutto il Paese; il gioco di carte italiano più diffuso). Si gioca con il mazzo italiano da 40 carte (denari, coppe, spade, bastoni).","deal":"Il mazziere dà 3 carte a ciascun giocatore e mette 4 carte scoperte sul tavolo; il resto è il tallone. Dopo che le 3 carte sono state giocate, se ne danno altre 3 a testa, senza aggiungere nulla sul tavolo, finché il tallone è finito (con due giocatori: 6 giri). Se sul tavolo ci sono 3 o 4 re, si rimescola e si dà di nuovo.","rules":["Valori di presa: Asso 1, 2–7 valore nominale, Fante 8, Cavallo 9, Re 10.","Un turno consiste nel giocare una carta. Una carta uguale a una carta del tavolo la prende (se ce ne sono più d’una, scegli tu). Solo se non c’è nessuna carta uguale puoi prendere un insieme di carte del tavolo la cui somma è uguale alla tua carta (priorità alla carta uguale). Altrimenti la carta resta sul tavolo.","La presa è obbligatoria quando è possibile; la scelta di quale carta giocare è libera.","Prendere tutte le carte del tavolo è una scopa (1 punto). Una presa fatta con l’ultima carta della mano non è mai scopa. Alla fine le carte rimaste sul tavolo vanno all’ultimo giocatore che ha preso.","Punteggio della mano: scope; Carte (più carte); Denari (più denari); Settebello (7 di denari); Primiera (la migliore primiera: una carta per seme, valori 7=21, 6=18, Asso=16, 5=15, 4=14, 3=13, 2=12, figure=10; chi non ha tutti i semi non può segnare la primiera). Un pareggio non dà punti.","Si gioca a 11 punti (21 o 31 per accordo); se entrambi superano l’obiettivo nella stessa mano vince il punteggio più alto; in caso di parità si gioca un’altra mano.","Con due giocatori comincia l’avversario del mazziere e la distribuzione si alterna a ogni mano."],"regional":["Il nord-est usa carte con semi francesi con Re, Donna, Fante.","Scale regionali della primiera: in alcune zone si contano 2–7 al valore nominale, l’Asso 5½ e le figure ½.","Opzionali: Re bello (Re di denari +1) e Napola (A-2-3… di denari) — disponibili come opzioni.","«Chiamarsi fuori» (dichiarare l’obiettivo prima della fine della mano) non è implementato."],"approx":[]},"scopone":{"name":"Scopone 9+4 (Wikipedia: «scientifico»)","origin":"Italia. La versione a quattro giocatori in coppie (i compagni siedono di fronte), con 4 carte sul tavolo all’inizio.","deal":"Ogni giocatore riceve 9 carte e 4 carte vanno scoperte sul tavolo (36 + 4 = 40). Con 3 o 4 re sul tavolo si rimescola e si ridà. Comincia il giocatore alla destra del mazziere; si gioca in senso antiorario.","rules":["Prese, scope, regola dell’ultima mano e punteggio come nella Scopa; le carte vinte vanno nel mucchio comune della coppia.","Una scopa fatta con l’ultima carta della mano non conta (un’opzione può abilitarla).","Obiettivo: 11 punti (opzionalmente 21); se entrambe le coppie lo superano nella stessa mano vince il punteggio più alto; in caso di parità si giocano altre mani."],"regional":["⚠ NOME CONTESTATO: Pagat e una guida italiana (Aranzulla) chiamano il 9+4 «Scopone» e il gioco a 10 carte con tavolo vuoto «Scopone scientifico»; Wikipedia italiana e inglese lo assegnano al contrario (scientifico = 9 carte + 4 sul tavolo; il gioco a 10 carte è «Scopone a 10 carte»). Le regole giocate sono le stesse qualunque sia il nome; il regolamento della federazione non ha potuto essere consultato. La variante è quindi indicata qui in base al numero di carte.","Obiettivo 21 in alcune fonti (Wikipedia italiana); 11 in Pagat (predefinito qui, 21 come opzione)."],"approx":["⚠ Le regole seguono le fonti; solo il NOME (Scopone / Scopone scientifico) differisce tra le fonti — vedi «Differenze regionali»."]},"scopone_s":{"name":"Scopone a 10 carte, tavolo vuoto (Pagat: «scientifico»)","origin":"Italia. Il membro «intellettuale» della famiglia: si distribuiscono tutte le 40 carte (10 a testa), il tavolo parte vuoto e un giocatore attento può contare le carte (tutte le carte giocate sono, in linea di principio, visibili alla memoria).","deal":"Ogni giocatore riceve 10 carte; il tavolo parte vuoto. Comincia il giocatore alla destra del mazziere; senso antiorario. I compagni siedono di fronte (posti 0–2 contro 1–3).","rules":["Prese come nella Scopa (la carta uguale ha priorità, altrimenti una somma); la presa è obbligatoria quando è possibile.","Una scopa (tavolo ripulito) vale 1 punto, ma NON con l’ultima carta della mano. Alcuni giocatori assegnano comunque una scopa alla squadra del mazziere sull’ultima carta (opzione: «La scopa vale anche all’ultima carta»).","Punteggio della mano: scope più fino a 4 punti (Carte, Denari, Settebello, Primiera). Non c’è un totale costante per mano: il punteggio di una mano dipende dalle scope. L’obiettivo della partita (11 o 21) è ciò che a volte si chiama «11 punti».","Opzioni: Re bello (+1), Napola (A-2-3… di denari, valore = lunghezza della sequenza), Napoleone (tutti i 10 denari vincono).","Durante il gioco le 40 carte finiscono nei mucchi delle coppie; alla fine tutte e 40 sono nei mucchi."],"regional":["⚠ NOME CONTESTATO: Pagat e Aranzulla chiamano questa variante (10 carte, tavolo vuoto) «Scopone scientifico»; Wikipedia italiana/inglese la chiamano «Scopone a 10 carte» e riservano «scientifico» al 9+4. Le regole sono le stesse. «9 carte e tavolo vuoto» è impossibile (4×9=36).","Una scopa sull’ultima carta del mazziere è contestata (Pagat: «alcuni ritengono che segni la squadra del mazziere»); per impostazione predefinita non conta.","Esiste una Federazione Italiana Scopone (federazionescopone.it); il suo regolamento non ha potuto essere consultato per questo progetto — si usa Pagat. L’obiettivo ufficiale (11 o 21) varia secondo le fonti."],"approx":["⚠ Le regole seguono le fonti; solo il NOME differisce tra le fonti — vedi «Differenze regionali»."]},"scopa15":{"name":"Scopa a 15 (Scopa di quindici)","origin":"Italia. Scopa in cui la somma da raggiungere è 15 invece del valore della carta giocata. Pagat descrive tre versioni; le prime due sono implementate.","deal":"Come nella Scopa: 3 carte a testa, 4 sul tavolo, distribuzioni da 3, nuova mano con 3–4 re.","rules":["Versione a (predefinita): si possono prendere SOLO carte del tavolo che, insieme alla carta giocata, fanno esattamente 15. Una carta non può prendere da sola una carta uguale (ad es. un 5 può prendere un 10).","Versione b: la carta giocata può prendere o una carta uguale, o un insieme di pari valore totale, o un insieme che con essa fa 15 (nessuna priorità fissa: scegli tu).","La presa è obbligatoria quando è possibile; scopa, ultima carta, punteggio e obiettivo come nella Scopa (11/21/31)."],"regional":["La versione 3 di Pagat (la seconda più l’Asso piglia tutto come scopa, di solito a 31) esiste solo nell’atlante.","Alcuni giocano una regola «meno carte» (nella versione 2) — non implementata.","Imparentata con l’escoba spagnola e giochi simili; non verificato qui."],"approx":["La versione 3 e la regola «meno carte» mancano (solo atlante)."]},"apt":{"name":"Asso piglia tutto","origin":"Italia. Scopa in cui l’Asso ha poteri speciali.","deal":"Come nella Scopa (3+4, distribuzioni da 3, nuova mano con 3–4 re).","rules":["Un Asso giocato su un tavolo senza altri Assi prende tutte le carte del tavolo e fa scopa. Se c’è già un Asso sul tavolo, l’Asso giocato prende solo quell’Asso (con più Assi ne scegli uno). Su un tavolo vuoto l’Asso resta lì.","Le altre carte si giocano come nella Scopa. Punteggio come nella Scopa."],"regional":["Pagat descrive la regola brevemente; il caso di più Assi sul tavolo non è indicato; qui si applica la regola ordinaria della Scopa (scegli un Asso uguale).","Wikipedia italiana aggiunge una regola facoltativa «del vile» (il primo giocatore non può giocare un Asso su un tavolo vuoto) — non implementata."],"approx":["⚠ La descrizione di Pagat è breve; quando ci sono più Assi sul tavolo l’Asso giocato ne prende uno solo, a tua scelta (interpretazione; Pagat tace)."]},"dassi":{"name":"Scopa d’assi","origin":"Italia. Come Asso piglia tutto, ma l’Asso che prende tutto non segna scopa; spesso si gioca in quattro in coppie con 9–10 carte.","deal":"Implementato: 4 giocatori in coppie, 10 carte a testa, tavolo vuoto, nessuna condizione di nuova mano (Wikipedia italiana). Comincia il giocatore alla destra del mazziere.","rules":["Un Asso giocato su un tavolo senza Assi prende tutte le carte del tavolo e NON segna scopa; se sul tavolo c’è un Asso, l’Asso giocato prende solo quell’Asso (come in Asso piglia tutto). Su un tavolo vuoto l’Asso resta lì.","Altre carte: come nella Scopa (la carta uguale ha priorità, altrimenti una somma); una scopa fatta con una carta che non è Asso conta.","Punteggio: Carte, Denari, Settebello, Primiera (+ scope), obiettivo 11/21."],"regional":["Varianti di Pagat: un Asso giocato su un tavolo vuoto prende se stesso; nuova mano se compare un Asso nella disposizione iniziale. Non implementate.","Pagat definisce la Scopa d’assi come Asso piglia tutto senza punto di scopa per l’Asso che prende tutto; lo stesso trattamento dell’Asso vale quando un Asso è già sul tavolo."],"approx":["⚠ Le fonti differiscono nei dettagli (Asso su tavolo vuoto, scope fatte con carte che non sono Assi, 9 o 10 carte); qui: 10 carte, un Asso prende tutto (quando non c’è un Asso sul tavolo) senza scopa, le scope fatte con altre carte contano, l’Asso su un tavolo vuoto resta."]},"cirulla":{"name":"Cirulla","origin":"Liguria (Genova) e Basso Piemonte. Tradizionalmente si gioca con carte genovesi a semi francesi; qui con un qualsiasi mazzo da 40 carte.","deal":"3 carte a testa e 4 sul tavolo; nuova mano se sul tavolo ci sono 2 o più Assi. Se le 4 carte del tavolo sommano esattamente 15 (1 scopa) o 30 (2 scope), il mazziere le prende subito.","rules":["Prese (a tua scelta): una carta uguale; un insieme con la stessa somma; carte che con la carta giocata fanno 15; un Asso prende tutto il tavolo se non c’è un Asso. Scopa = tavolo ripulito (1 punto); alla fine il resto del tavolo va all’ultimo che ha preso, senza scopa.","Bonus di mano: tre carte che sommano ≤ 9 = 3 scope («barsega»); tre carte uguali = 10 scope («barsegon»); il 7 di coppe (cuori) è una matta (jolly) solo per il bonus.","Punteggio: scope, Carte, Denari, Settebello, Primiera, La piccola (A-2-3… di denari, 1 punto per carta, minimo 3, al massimo 6), La grande (Re+Cavallo+Fante di denari = 5). Tutti i 10 denari = «cappotto»: vittoria immediata.","Obiettivo: 51 (in alternativa 31/21); la mano viene comunque finita."],"regional":["Pagat segnala più momenti consentiti per dichiarare i bonus (bussare: all’inizio del turno, tra la distribuzione e la prima carta, subito dopo la distribuzione).","Cirullone (Liguria) e Cicera (Brescia) sono giochi imparentati/distinti — solo menzionati.","Manca la variante da torneo (cappotto anche per quattro carte dello stesso valore sul tavolo)."],"approx":["⚠ I bonus di mano sono dichiarati automaticamente all’inizio di ogni distribuzione da 3 carte (niente bussare, bluff o ritrattazione), per entrambi i giocatori; la matta viene scelta automaticamente per il miglior risultato.","⚠ «La piccola» limitata a 6 e «La grande» = 5 secondo il riepilogo di Pagat; i valori esatti non sono stati confermati da una seconda fonte.","⚠ La presa è obbligatoria per la carta giocata se può prendere (Pagat è meno esplicito)."]},"rubamazzo":{"name":"Rubamazzo (Rubamazzetto)","origin":"Italia. Un gioco semplificato simile alla Scopa in cui si può rubare il mazzetto dell’avversario.","deal":"3 carte a testa, 4 sul tavolo, distribuzioni da 3 finché il tallone è esaurito. Comincia l’avversario del mazziere.","rules":["Giochi una carta. Se ha lo stesso valore di una carta del tavolo, la prendi (mettendo la tua carta in cima al tuo mazzetto). Se ha lo stesso valore della carta in cima al mazzetto dell’avversario (l’ultima presa, sempre visibile), puoi rubare l’intero mazzetto. Se sono possibili entrambe le cose, scegli tu.","Prendere o rubare è obbligatorio quando è possibile; altrimenti la carta resta sul tavolo.","Alla fine il resto del tavolo va all’ultimo che ha preso; vince chi ha più carte (20–20 = pareggio)."],"regional":["Le regole locali variano molto (l’Asso ladro; chi può rubare dal proprio mazzetto; regole dell’ultima mano).","Le fonti consultate (Wikipedia italiana, una guida italiana) non descrivono alcuna protezione aggiuntiva del mazzetto né punti speciali."],"approx":["⚠ Le regole regionali variano; è implementato il nucleo comune di due fonti. Nessuna variante con l’Asso, nessun punto extra. IA semplice (euristica, non Monte-Carlo)."]},"bazzica":{"name":"Scopa Bazzica","origin":"Italia (due giocatori).","deal":"","rules":["Subito dopo la distribuzione di 3 carte si possono dichiarare combinazioni: Bazzica (tre carte che sommano ≤ 9, figure 10) = 3 punti; Bazzicotto (tre carte dello stesso valore) = 10 punti. Segna solo la migliore; per la bazzica vince il totale più basso, per il bazzicotto il valore più basso. Partite a 21 o 31."],"regional":[],"approx":[]},"scalette":{"name":"Scopa con scalette / Napola","origin":"Italia.","deal":"","rules":["Sequenze di denari: scala bassa (A-2-3, 3 punti, estesa fino al Cavallo = 9) e scala alta (Re-Cavallo-Fante, 5 punti, estesa verso il basso fino al 2 = 11). Tutti i denari = «Scala»: vittoria. Napola: A-2-3… di denari, un punto per carta."],"regional":["Napola e Re bello sono opzioni nella Scopa/Scopone; le scalette esistono solo nell’atlante."],"approx":[]},"sbarazzina":{"name":"Sbarazzina e Piva","origin":"Emilia (Italia).","deal":"","rules":["Sbarazzina: l’Asso piglia tutto senza scopa; il Re bello è un punto; bazzica 2 punti (tutti i valori diversi) o 3 (con una coppia); tris = 7; partita a 41. Piva: variante a due giocatori con carte piacentine in cui prendere il 2 di bastoni vale −5 punti; partite a 21 o 31, i punteggi possono diventare negativi."],"regional":[],"approx":[]},"corsa":{"name":"Scopa corsa","origin":"Corsica.","deal":"","rules":["Mazzo da 36 carte (senza i 2). Due giocatori: distribuzioni di 3,3,3,3,4,4; quattro giocatori in coppie fisse. La presa non è obbligatoria. Partite a 21 (o 16/11)."],"regional":[],"approx":[]},"chkobba":{"name":"Chkobba","origin":"Tunisia; popolare anche in Francia.","deal":"","rules":["Mazzo francese da 40 carte (senza 8, 9, 10; Fante 9, Donna 8). La carta tagliata può essere tenuta o messa sul tavolo. Presa obbligatoria; chkobba = tavolo ripulito, non sull’ultima carta del mazziere. Punteggio: kārṭa (più carte), dīnārī (quadri), barmīla (più sette, poi sei), sabʿa l-ḥayya (7 di quadri), più la chkobba. Obiettivo 21 (o 11/31)."],"regional":[],"approx":[]},"hurrikan":{"name":"Hurrikan","origin":"Germania, anni ’30.","deal":"","rules":["Tre sotto-mani da sei carte; i cuori sono il seme bonus (7 di cuori = 1 punto, sei o più cuori = 1 punto). Obiettivo 16; partita doppia se il perdente ha meno di 8."],"regional":[],"approx":[]},"cicera":{"name":"Cicera, Cirullone","origin":"Brescia (Cicera), Liguria (Cirullone).","deal":"","rules":["Giochi vicini alla Cirulla/Scopone, con pagine separate su Pagat; le loro regole complete non hanno potuto essere lette qui, quindi non sono né descritte né implementate."],"regional":[],"approx":[]}},"es":{"scopa":{"name":"Scopa","origin":"Italia (en todo el país; el juego de cartas italiano más extendido). Se juega con la baraja italiana de 40 cartas (oros, copas, espadas, bastos).","deal":"El repartidor da 3 cartas a cada jugador y coloca 4 cartas boca arriba en la mesa; el resto es el mazo. Cuando se han jugado las 3 cartas, se reparten otras 3 a cada uno, sin añadir nada a la mesa, hasta que se acaba el mazo (con dos jugadores: 6 rondas). Si en la mesa hay 3 o 4 reyes, se baraja y se reparte de nuevo.","rules":["Valores de captura: As 1, 2–7 su valor, Fante (sota) 8, Cavallo (caballo/reina) 9, Re (rey) 10.","Un turno consiste en jugar una carta. Una carta igual a una de la mesa la captura (si hay varias, eliges). Solo si no hay ninguna carta igual puedes llevarte un conjunto de cartas de la mesa cuya suma sea igual a tu carta (prioridad de la carta igual). Si no, la carta se queda en la mesa.","La captura es obligatoria cuando es posible; la elección de qué carta jugar es libre.","Capturar todas las cartas de la mesa es una escoba (scopa, 1 punto). Una captura hecha con la última carta de la mano nunca es escoba. Al final, las cartas que quedan en la mesa van al último jugador que capturó.","Puntuación de la mano: escobas; Carte (más cartas); Denari (más oros); Settebello (7 de oros); Primiera (la mejor primiera: una carta por palo, valores 7=21, 6=18, As=16, 5=15, 4=14, 3=13, 2=12, figuras=10; un bando al que le falte un palo no puede puntuarla). Un empate no da punto.","Se juega a 11 puntos (21 o 31 por acuerdo); si ambos superan el objetivo en la misma mano, gana la puntuación más alta; si hay empate, se juega otra mano.","Con dos jugadores empieza el rival del repartidor y el reparto se alterna en cada mano."],"regional":["El noreste usa cartas con palos franceses con Rey, Reina, Jota.","Escalas regionales de la primiera: algunas zonas cuentan 2–7 a su valor, el As 5½ y las figuras ½.","Opcionales: Re bello (rey de oros +1) y Napola (A-2-3… de oros) — disponibles como opciones.","«Chiamarsi fuori» (declarar el objetivo antes del final de la mano) no está implementado."],"approx":[]},"scopone":{"name":"Scopone 9+4 (Wikipedia: «scientifico»)","origin":"Italia. La versión de cuatro jugadores por parejas (los compañeros se sientan enfrente), con 4 cartas en la mesa al principio.","deal":"Cada jugador recibe 9 cartas y 4 cartas van boca arriba a la mesa (36 + 4 = 40). Con 3 o 4 reyes en la mesa, se baraja y se vuelve a repartir. Empieza el jugador a la derecha del repartidor; se juega en sentido contrario a las agujas del reloj.","rules":["Las capturas, las escobas, la regla de la última mano y la puntuación son como en la Scopa; las cartas ganadas van al montón común de la pareja.","Una escoba hecha con la última carta de la mano no cuenta (una opción puede activarla).","Objetivo: 11 puntos (opcionalmente 21); si ambos bandos lo superan en la misma mano, gana la puntuación más alta; si hay empate, se juegan más manos."],"regional":["⚠ NOMBRE DISPUTADO: Pagat y una guía italiana (Aranzulla) llaman «Scopone» al 9+4 y «Scopone scientifico» al juego de 10 cartas con mesa vacía; las Wikipedias italiana e inglesa lo asignan al revés (scientifico = 9 cartas + 4 en la mesa; el juego de 10 cartas es «Scopone a 10 carte»). Las reglas que se juegan son las mismas sea cual sea el nombre; no se pudo consultar el reglamento de la federación. Por eso aquí la variante se rotula por el número de cartas.","Objetivo 21 en algunas fuentes (Wikipedia italiana); 11 en Pagat (el valor por defecto aquí, 21 como opción)."],"approx":["⚠ Las reglas siguen las fuentes; solo el NOMBRE (Scopone / Scopone scientifico) difiere entre fuentes — véase «Diferencias regionales»."]},"scopone_s":{"name":"Scopone de 10 cartas, mesa vacía (Pagat: «scientifico»)","origin":"Italia. El miembro «intelectual» de la familia: se reparten las 40 cartas (10 cada uno), la mesa empieza vacía y un jugador atento puede contar cartas (todas las cartas jugadas son, en principio, visibles en la memoria).","deal":"Cada jugador recibe 10 cartas; la mesa empieza vacía. Empieza el jugador a la derecha del repartidor; en sentido contrario a las agujas del reloj. Los compañeros se sientan enfrente (asientos 0–2 contra 1–3).","rules":["Capturas como en la Scopa (la carta igual tiene prioridad, si no, una suma); la captura es obligatoria cuando es posible.","Una escoba (mesa limpia) vale 1 punto, pero NO con la última carta de la mano. Algunos jugadores aun así dan una escoba al bando del repartidor en la última carta (opción: «La escoba cuenta también en la última carta»).","Puntuación de la mano: escobas más hasta 4 puntos (Carte, Denari, Settebello, Primiera). No hay un total constante por mano: la puntuación de una mano depende de las escobas. El objetivo de la partida (11 o 21) es lo que a veces se llama «11 puntos».","Opciones: Re bello (+1), Napola (A-2-3… de oros, valor = longitud de la escalera), Napoleone (los 10 oros ganan).","Durante el juego las 40 cartas acaban en los montones de las parejas; al final las 40 están en los montones."],"regional":["⚠ NOMBRE DISPUTADO: Pagat y Aranzulla llaman a esta variante (10 cartas, mesa vacía) «Scopone scientifico»; las Wikipedias italiana e inglesa la llaman «Scopone a 10 carte» y reservan «scientifico» para el 9+4. Las reglas son las mismas. «9 cartas y mesa vacía» es imposible (4×9=36).","Una escoba en la última carta del repartidor es discutida (Pagat: «algunos sostienen que puntúa el equipo del repartidor»); por defecto no cuenta.","Existe una Federazione Italiana Scopone (federazionescopone.it); no se pudo consultar su reglamento para este proyecto — se usa Pagat. El objetivo oficial (11 o 21) varía según la fuente."],"approx":["⚠ Las reglas siguen las fuentes; solo el NOMBRE difiere entre fuentes — véase «Diferencias regionales»."]},"scopa15":{"name":"Scopa a 15 (Scopa di quindici)","origin":"Italia. Una Scopa donde la suma buscada es 15 en lugar del valor de la carta jugada. Pagat describe tres versiones; las dos primeras están implementadas.","deal":"Como en la Scopa: 3 cartas cada uno, 4 en la mesa, repartos de 3, nuevo reparto con 3–4 reyes.","rules":["Versión a (por defecto): solo puedes llevarte cartas de la mesa que, junto con la carta jugada, sumen exactamente 15. Una carta no puede capturar por sí sola una carta igual (p. ej., un 5 puede llevarse un 10).","Versión b: la carta jugada puede capturar una carta igual, un conjunto de igual valor total o un conjunto que con ella sume 15 (sin prioridad fija: eliges).","La captura es obligatoria cuando es posible; escoba, última carta, puntuación y objetivo como en la Scopa (11/21/31)."],"regional":["La versión 3 de Pagat (la segunda más el As que se lo lleva todo como escoba, normalmente a 31) solo existe en el atlas.","Algunos juegan una regla de «menos cartas» (en la versión 2) — no implementada.","Emparentada con la escoba española y juegos similares; no verificado aquí."],"approx":["Faltan la versión 3 y la regla de «menos cartas» (solo atlas)."]},"apt":{"name":"Asso piglia tutto (el As se lo lleva todo)","origin":"Italia. Una Scopa en la que el As tiene poderes especiales.","deal":"Como en la Scopa (3+4, repartos de 3, nuevo reparto con 3–4 reyes).","rules":["Un As jugado en una mesa sin otro As se lleva todas las cartas de la mesa y puntúa escoba. Si ya hay un As en la mesa, el As jugado solo se lleva ese As (con varios Ases eliges uno). En una mesa vacía el As se queda.","Las demás cartas se juegan como en la Scopa. Puntuación como en la Scopa."],"regional":["Pagat describe la regla brevemente; no se indica el caso de varios Ases en la mesa; aquí se aplica la regla ordinaria de la Scopa (eliges un As igual).","La Wikipedia italiana añade una regla opcional «del vile» (el primer jugador no puede jugar un As en una mesa vacía) — no implementada."],"approx":["⚠ La descripción de Pagat es breve; cuando hay varios Ases en la mesa el As jugado se lleva solo uno, a tu elección (interpretación; Pagat no dice nada)."]},"dassi":{"name":"Scopa d’assi","origin":"Italia. Como Asso piglia tutto, pero el As que se lo lleva todo no puntúa escoba; suele jugarse entre cuatro por parejas con 9–10 cartas.","deal":"Implementado: 4 jugadores por parejas, 10 cartas cada uno, mesa vacía, sin condición de nuevo reparto (Wikipedia italiana). Empieza el jugador a la derecha del repartidor.","rules":["Un As jugado en una mesa sin ningún As se lleva todas las cartas de la mesa y NO puntúa escoba; si hay un As en la mesa, el As jugado solo se lleva ese As (como en Asso piglia tutto). En una mesa vacía el As se queda.","Otras cartas: como en la Scopa (la carta igual tiene prioridad, si no, una suma); una escoba hecha con una carta que no sea As sí cuenta.","Puntuación: Carte, Denari, Settebello, Primiera (+ escobas), objetivo 11/21."],"regional":["Variantes de Pagat: un As jugado en una mesa vacía se lleva a sí mismo; nuevo reparto si aparece un As en la disposición inicial. No implementadas.","Pagat define la Scopa d’assi como Asso piglia tutto sin punto de escoba para el As que se lo lleva todo; el mismo tratamiento del As se aplica cuando ya hay un As en la mesa."],"approx":["⚠ Las fuentes difieren en detalles (As en mesa vacía, escobas hechas con cartas que no son Ases, 9 o 10 cartas); aquí: 10 cartas, un As se lo lleva todo (cuando no hay As en la mesa) sin escoba, las escobas hechas con otras cartas cuentan, el As en una mesa vacía se queda."]},"cirulla":{"name":"Cirulla","origin":"Liguria (Génova) y Bajo Piamonte. Tradicionalmente se juega con cartas genovesas de palos franceses; aquí con cualquier baraja de 40 cartas.","deal":"3 cartas cada uno y 4 en la mesa; nuevo reparto si hay 2 o más Ases en la mesa. Si las 4 cartas de la mesa suman exactamente 15 (1 escoba) o 30 (2 escobas), el repartidor se las lleva de inmediato.","rules":["Capturas (a tu elección): una carta igual; un conjunto con la misma suma; cartas que con la carta jugada sumen 15; un As se lleva toda la mesa si no hay un As en ella. Escoba = mesa limpia (1 punto); al final el resto de la mesa va al último que capturó, sin escoba.","Bonificaciones de mano: tres cartas que sumen ≤ 9 = 3 escobas («barsega»); tres cartas iguales = 10 escobas («barsegon»); el 7 de copas (corazones) es comodín (matta) solo para la bonificación.","Puntuación: escobas, Carte, Denari, Settebello, Primiera, La piccola (A-2-3… de oros, 1 punto por carta, mínimo 3, como máximo 6), La grande (Rey+Caballo+Sota de oros = 5). Los 10 oros = «cappotto»: victoria inmediata.","Objetivo: 51 (alternativamente 31/21); la mano se termina de todos modos."],"regional":["Pagat señala varios momentos permitidos para declarar las bonificaciones (golpear: al inicio del turno, entre el reparto y la primera carta, inmediatamente después del reparto).","Cirullone (Liguria) y Cicera (Brescia) son juegos emparentados/d
